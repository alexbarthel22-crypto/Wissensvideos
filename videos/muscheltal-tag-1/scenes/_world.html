  <script>
    (() => {
      /*__CUE_HELPERS__*/
      // Muschel-Tal-Welt wie auf muscheltal.de: Draufsicht, Lagune, Riffe, Brandung, Palmen, Hütten, Boote, Wolken.
      // Alles hängt nur an der Timeline-Zeit t (deterministisch, seek-fähig). Bildanker: (540, 640) = Mitte der Bildzone.

      function hash(x, y) { let h = (x * 374761393 + y * 668265263) | 0; h = (h ^ (h >>> 13)) * 1274126177 | 0; return ((h ^ (h >>> 16)) >>> 0) / 4294967296; }

      // ---------- Hauptinsel: 500 Plätze im Raster, nach Abstand zum Muschelplatz sortiert ----------
      const PLAZA = 78;
      function plaetze(n) { const out = []; let r = Math.sqrt((n + 30) * 600 / Math.PI) + PLAZA + 40;
        for (;;) { out.length = 0; const g = Math.ceil(r / S);
          for (let gx = -g; gx <= g; gx++) for (let gy = -g; gy <= g; gy++) { if (((gx % 5) + 5) % 5 === 0 || ((gy % 4) + 4) % 4 === 0) continue;
            const x = gx * S, y = gy * S * .9, d = Math.hypot(x, y); if (d < PLAZA || d > r) continue; out.push({ gx, gy, x, y, k: d + hash(gx, gy) * 14 }); }
          if (out.length >= n + 30) break; r *= 1.2; }
        out.sort((a, b) => a.k - b.k); return out.slice(0, n); }
      const PL = plaetze(500), KEYS = new Set(PL.map(p => p.gx + "," + p.gy));
      const ROOFS = ["#e8467c", "#f4a51c", "#ff7a59", "#2fb3a0", "#9b6bff", "#3fa0e8"], WALLS = ["#d9a066", "#e4b47c", "#cf9459", "#e9c48f"];
      PL.forEach((p, i) => { const h = hash(p.gx + 7, p.gy - 3); p.round = h < .28; p.wall = WALLS[(h * 97 | 0) % 4]; p.roof = ROOFS[(h * 631 | 0) % 6]; p.win = hash(p.gx, p.gy + 11) < .55; });
      function mkCoast(base, plots, seed) { const a = new Array(BINS).fill(base);
        for (const p of plots) { const b = ((Math.atan2(p.y, p.x) + Math.PI) / TAU * BINS | 0) % BINS, d = Math.hypot(p.x, p.y) + 34; if (d > a[b]) a[b] = d; }
        const s = a.map((_, i) => { let m = 0; for (let k = -3; k <= 3; k++) m = Math.max(m, a[(i + k + BINS) % BINS] - Math.abs(k) * 4); return m; });
        return s.map((d, i) => { const an = i / BINS * TAU - Math.PI; return d + 8 * Math.sin(an * 5 + seed) + 5 * Math.sin(an * 11 + 1 + seed); }); }
      const MAIN = { x: 0, y: 0, coast: mkCoast(150, PL, 0), tier: 0 }; MAIN.R = Math.max(...MAIN.coast);
      const coastAt = (v, a) => { const f = ((a + Math.PI) / TAU * BINS % BINS + BINS) % BINS, i = f | 0, k = f - i; return v.coast[i] * (1 - k) + v.coast[(i + 1) % BINS] * k; };
      const polar = (v, a, d) => [v.x + Math.cos(a) * d, v.y + Math.sin(a) * d * .92];
      function shape(v, off, wob = 0, t = 0) { c.beginPath(); for (let i = 0; i <= BINS; i++) { const k = i % BINS, a = k / BINS * TAU - Math.PI,
        d = v.coast[k] + off + (wob ? wob * Math.sin(a * 7 + t * 1.7) + wob * .6 * Math.sin(a * 13 - t * 1.1) : 0); const [x, y] = polar(v, a, d); i ? c.lineTo(x, y) : c.moveTo(x, y); } c.closePath(); }
      const inside = (v, x, y, m = 0) => { const lx = x - v.x, ly = (y - v.y) / .92; return Math.hypot(lx, ly) < coastAt(v, Math.atan2(ly, lx)) - m; };

      const NB = [[-0.55, 150, 1], [0.95, 190, 2], [2.35, 230, 3], [3.75, 270, 4]].map(([a, r, tier], i) => {
        const d = MAIN.R + r + 280; const v = { x: Math.cos(a) * d, y: Math.sin(a) * d * .92, tier, coast: mkCoast(r, [], i * 2 + 1) }; v.R = Math.max(...v.coast); return v; });

          if (h < pp) v.palms.push({ x: jx, y: jy, ph: hash(gx, gy) * TAU, s: .85 + hash(gy, gx) * .45 });
          else if (h < pp + .1) v.bush.push({ x: jx, y: jy, r: 3 + hash(gx, gy) * 3 });

      const K = [

      function camAt(t) { let i = 0; while (i < K.length - 1 && K[i + 1][0] <= t) i++; const a = K[i], b = K[Math.min(i + 1, K.length - 1)];

      function land(v, snowy) {
        c.fillStyle = snowy ? "#e8f1f6" : "#e6cf98"; blob(v, 13); c.fill();

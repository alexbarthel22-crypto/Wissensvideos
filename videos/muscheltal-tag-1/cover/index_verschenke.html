<!doctype html>
<html lang="de"><head><meta charset="utf-8">
<style>
@font-face { font-family: "Lilita One"; src: url("LilitaOne-Regular.woff2") format("woff2"); }
* { box-sizing: border-box; margin: 0; }
body { width: 1080px; height: 1920px; overflow: hidden; background: #04203a; font-family: "Inter", system-ui, sans-serif; }
#bg { position: absolute; left: 205px; top: 420px; width: 670px; height: 1191px; background: url("bg.jpg") center / 100% 100%;
  -webkit-mask: radial-gradient(ellipse 50% 29% at 50% 49%, #000 70%, transparent 100%); }
#spot { position: absolute; inset: 0; background: radial-gradient(ellipse 55% 30% at 50% 52%, rgba(20,170,200,.55), rgba(4,32,58,0) 70%); }
#rays { position: absolute; left: -260px; top: 360px; width: 1600px; height: 1600px; border-radius: 50%;
  background: repeating-conic-gradient(from 4deg, rgba(255,229,0,.14) 0deg 7deg, rgba(255,229,0,0) 7deg 18deg);
  -webkit-mask: radial-gradient(circle, #000 0%, #000 25%, transparent 62%); }
.pill { position: absolute; left: 0; right: 0; margin: 0 auto; width: fit-content; border-radius: 40px; font-weight: 900; }
#ep { top: 262px; padding: 6px 20px 9px; font-size: 26px; letter-spacing: .14em; background: #1a0f08; color: #fff; box-shadow: 0 0 0 4px #ffe500; }
#tag { top: 340px; padding: 8px 30px 12px; font-size: 46px; letter-spacing: .14em; background: #ffe500; color: #1a0f08; box-shadow: 0 0 0 5px #1a0f08; transform: rotate(-2deg); }
#gratis { position: absolute; left: 0; right: 0; top: 420px; text-align: center; font-family: "Lilita One", sans-serif; font-size: 190px; line-height: 1; color: #ffe500;
  -webkit-text-stroke: 14px #1a0f08; paint-order: stroke fill; text-shadow: 0 12px 0 #ff2e7e; transform: rotate(-4deg); }
#sub { top: 630px; z-index: 2; padding: 10px 30px 14px; font-size: 52px; background: #1a0f08; color: #fff; box-shadow: 0 0 0 5px #ffe500; transform: rotate(1.5deg); }
#sub b { color: #ffe500; }
.stat { position: absolute; top: 1330px; width: 330px; padding: 14px 0 18px; border-radius: 36px; text-align: center; color: #fff; box-shadow: 0 0 0 6px #1a0f08, 0 12px 0 rgba(0,0,0,.45); }
.stat b { display: block; font-family: "Lilita One", sans-serif; font-size: 110px; line-height: 1; }
.stat small { font-weight: 900; font-size: 34px; letter-spacing: .08em; }
#s1 { left: 180px; background: #ff2e7e; transform: rotate(-4deg); } #s2 { left: 570px; background: #0098ff; transform: rotate(3deg); }
#free { top: 1560px; padding: 10px 30px 14px; font-size: 44px; background: #00b86b; color: #fff; box-shadow: 0 0 0 5px #1a0f08; transform: rotate(-1.5deg); }
.sp { position: absolute; }
#stamp { position: absolute; left: 690px; top: 770px; padding: 6px 26px 10px; border: 9px solid #ff2e7e; border-radius: 36px; background: rgba(255,255,255,.95);
  color: #ff2e7e; font-family: "Lilita One", sans-serif; font-size: 70px; transform: rotate(14deg); box-shadow: 0 10px 0 rgba(0,0,0,.35); }
</style></head><body>
<div id="spot"></div><div id="rays"></div><div id="bg"></div>
<div id="ep" class="pill">TAG 1 · DIE GRÜNDUNG</div>
<div id="tag" class="pill">ICH VERSCHENKE</div>
<div id="gratis">HÄUSER!</div>
<div id="sub" class="pill">auf meiner <b>Insel</b></div>
<div class="stat" id="s1"><b>0</b><small>EINWOHNER</small></div>
<div class="stat" id="s2"><b>0</b><small>MUSCHELN</small></div>
<div id="free" class="pill">HÜTTE NR. 1 IST FREI</div>
<div id="stamp">GRATIS</div>

<svg class="sp" style="left:850px;top:380px;width:56px" viewBox="-10 -10 20 20"><path d="M0 -10 L2 -2 L10 0 L2 2 L0 10 L-2 2 L-10 0 L-2 -2Z" fill="#fff"/></svg>
<svg class="sp" style="left:860px;top:1180px;width:50px" viewBox="-10 -10 20 20"><path d="M0 -10 L2 -2 L10 0 L2 2 L0 10 L-2 2 L-10 0 L-2 -2Z" fill="#ffe500"/></svg>
<svg class="sp" style="left:160px;top:1150px;width:44px" viewBox="-10 -10 20 20"><path d="M0 -10 L2 -2 L10 0 L2 2 L0 10 L-2 2 L-10 0 L-2 -2Z" fill="#fff"/></svg>
</body></html>

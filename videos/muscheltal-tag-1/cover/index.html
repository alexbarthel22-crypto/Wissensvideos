<!doctype html>
<html lang="de"><head><meta charset="utf-8">
<style>
@font-face { font-family: "Lilita One"; src: url("LilitaOne-Regular.woff2") format("woff2"); }
* { box-sizing: border-box; margin: 0; }
body { width: 1080px; height: 1920px; overflow: hidden; position: relative; font-family: "Inter", system-ui, sans-serif;
  background: linear-gradient(180deg, #0a8fd0 0%, #0a5fa8 55%, #062f63 100%); }
#img { position: absolute; left: 0; top: 0; width: 1080px; height: 1180px; background: url("bg2.jpg") center top / 1080px 1920px no-repeat; }
#img::after { content: ""; position: absolute; inset: 0; background: radial-gradient(ellipse 60% 40% at 50% 38%, rgba(255,255,255,0), rgba(4,40,80,.35)); }
#wave { position: absolute; left: 0; top: 1040px; width: 1080px; height: 200px; }
#glow { position: absolute; left: 290px; top: 300px; width: 500px; height: 500px; border-radius: 50%; background: radial-gradient(closest-side, rgba(255,236,150,.6), rgba(255,236,150,0)); }
.chip { position: absolute; display: flex; align-items: center; gap: 14px; font-weight: 900; color: #fff; }
#brand { left: 0; right: 0; margin: 0 auto; width: fit-content; top: 296px; padding: 10px 14px 10px 28px; border-radius: 999px;
  background: rgba(6,47,99,.82); border: 4px solid #fff; font-size: 40px; letter-spacing: .04em; box-shadow: 0 10px 30px rgba(0,0,0,.3); }
#brand span { background: #ff6a1a; border-radius: 999px; padding: 4px 18px 6px; font-size: 32px; }
#zero { left: 760px; top: 430px; width: 220px; height: 220px; border-radius: 50%; flex-direction: column; justify-content: center; gap: 0;
  background: linear-gradient(160deg, #ffb347, #ff5e1a); border: 7px solid #fff; transform: rotate(10deg); box-shadow: 0 14px 0 rgba(120,40,0,.35); }
#zero b { font-family: "Lilita One"; font-weight: 400; font-size: 110px; line-height: .9; }
#zero i { font-style: normal; font-size: 24px; letter-spacing: .02em; margin-top: 4px; }
#h1 { position: absolute; left: 0; right: 0; top: 1190px; text-align: center; font-family: "Lilita One"; font-size: 104px; line-height: 1; color: #fff;
  text-shadow: 0 8px 0 rgba(3,30,60,.55); letter-spacing: .01em; }
#h2 { position: absolute; left: 0; right: 0; top: 1300px; text-align: center; font-family: "Lilita One"; font-size: 200px; line-height: 1; color: #ffb02e;
  -webkit-text-stroke: 22px #fff; paint-order: stroke fill; text-shadow: 0 16px 0 #ff3d7f, 0 26px 40px rgba(0,0,0,.4); transform: rotate(-3deg); }
#h2 em { font-style: normal; color: #ff6a1a; }
#cta { left: 0; right: 0; margin: 0 auto; width: fit-content; top: 1580px; padding: 14px 40px 18px; border-radius: 999px; background: #fe2c55; font-size: 48px;
  box-shadow: 0 10px 0 rgba(100,0,20,.4); }
#cta small { font-size: 48px; opacity: .95; font-weight: 800; }
</style></head><body>
<div id="img"></div>
<div id="glow"></div>
<svg id="wave" viewBox="0 0 1080 200" preserveAspectRatio="none">
  <path d="M0 90 Q135 40 270 90 T540 90 T810 90 T1080 90 V200 H0Z" fill="#0a8fd0"/>
  <path d="M0 90 Q135 40 270 90 T540 90 T810 90 T1080 90" fill="none" stroke="#fff" stroke-width="12" stroke-linecap="round"/>
  <path d="M0 125 Q135 80 270 125 T540 125 T810 125 T1080 125" fill="none" stroke="rgba(255,255,255,.35)" stroke-width="6"/>
</svg>
<div id="brand" class="chip">🐚 MUSCHEL-TAL <span>TAG 1</span></div>
<div id="zero" class="chip"><b>0</b><i>EINWOHNER</i></div>
<div id="h1">HIER STEHT BALD</div>
<div id="h2">DEIN <em>HAUS</em></div>
<div id="cta" class="chip">+ Folgen <small>= einziehen 🏝️</small></div>
</body></html>

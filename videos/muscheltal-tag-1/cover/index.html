<style>
@font-face { font-family: "Lilita One"; src: url("LilitaOne-Regular.woff2") format("woff2"); }
* { box-sizing: border-box; margin: 0; }
body { width: 1080px; height: 1920px; overflow: hidden; position: relative; font-family: "Inter", system-ui, sans-serif;

#name span { background: #ff6a1a; border-radius: 999px; padding: 2px 16px 6px; font-size: 36px; }
.bdg { position: absolute; width: 280px; height: 280px; border-radius: 50%; display: flex; flex-direction: column; align-items: center; justify-content: center;

.bdg b { font-family: "Lilita One"; font-weight: 400; font-size: 150px; line-height: .85; }
.bdg i { font-style: normal; font-size: 30px; letter-spacing: .02em; margin-top: 6px; }

#h2 { position: absolute; left: 0; right: 0; top: 1300px; text-align: center; font-family: "Lilita One"; font-size: 192px; line-height: 1; color: #ffc93c; letter-spacing: .02em;

#h2 em { font-style: normal; color: #ff7a1f; }
#cta { left: 0; right: 0; margin: 0 auto; width: fit-content; top: 1580px; padding: 14px 40px 18px; border-radius: 999px; background: #fe2c55; font-size: 48px;

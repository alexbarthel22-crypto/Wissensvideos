<!doctype html>
<html lang="de"><head><meta charset="utf-8">
<style>
@font-face { font-family: "Lilita One"; src: url("LilitaOne-Regular.woff2") format("woff2"); }
* { box-sizing: border-box; margin: 0; }
body { width: 1080px; height: 1920px; overflow: hidden; background: #0b6aa6; font-family: "Inter", system-ui, sans-serif; }
#bg { position: absolute; inset: 0; background: url("bg.jpg") center / cover; }
#shade { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(4,40,70,.55) 0%, rgba(4,40,70,0) 30%, rgba(4,40,70,0) 58%, rgba(4,40,70,.6) 100%); }
#rays { position: absolute; left: -260px; top: 300px; width: 1600px; height: 1600px; border-radius: 50%;
  background: repeating-conic-gradient(from 8deg, rgba(255,255,255,.16) 0deg 8deg, rgba(255,255,255,0) 8deg 20deg);
  -webkit-mask: radial-gradient(circle, #000 0%, #000 30%, transparent 68%); }
.kick { position: absolute; left: 0; right: 0; margin: 0 auto; width: fit-content; top: 270px; padding: 10px 30px 14px; border-radius: 40px;
  background: #2a1b12; color: #ffd23f; font-weight: 900; font-size: 40px; letter-spacing: .12em; transform: rotate(-2deg); box-shadow: 0 8px 0 rgba(0,0,0,.3); }
#title { position: absolute; left: 0; right: 0; top: 360px; text-align: center; transform: rotate(-3deg); }
#title span { display: inline-block; font-family: "Lilita One", sans-serif; color: #fff; line-height: 1; padding: 6px 40px 18px; border-radius: 50px;
  background: #ff3d7f; box-shadow: 0 14px 0 rgba(0,0,0,.28); -webkit-text-stroke: 3px #2a1b12; paint-order: stroke fill; }
#t1 { font-size: 120px; margin-bottom: 18px; } #t2 { font-size: 172px; }
.card { position: absolute; top: 1190px; width: 430px; height: 340px; border-radius: 48px; background: #fff; border: 8px solid #2a1b12; box-shadow: 14px 14px 0 rgba(42,27,18,.85); text-align: center; }
.card .ic { position: absolute; left: 50%; top: -70px; width: 140px; height: 140px; margin-left: -70px; border-radius: 50%; border: 8px solid #2a1b12; display: grid; place-items: center; }
.card .ic svg { width: 92px; height: 92px; }
.card b { display: block; margin-top: 70px; font-family: "Lilita One", sans-serif; font-size: 190px; line-height: .95; }
.card small { display: block; font-weight: 900; font-size: 44px; letter-spacing: .06em; color: #2a1b12; }
#c1 { left: 80px; transform: rotate(-4deg); } #c1 .ic { background: #ffd23f; } #c1 b { color: #e8467c; }
#c2 { left: 570px; transform: rotate(3deg); } #c2 .ic { background: #7fe5dc; } #c2 b { color: #0a9fa6; }
.chip { position: absolute; left: 0; right: 0; margin: 0 auto; width: fit-content; top: 1590px; padding: 10px 40px 16px; border-radius: 50px; background: #2fbf6a; color: #fff;
  font-weight: 900; font-size: 54px; box-shadow: 0 10px 0 rgba(0,0,0,.3); transform: rotate(-1.5deg); }
.sp { position: absolute; }
</style></head><body>

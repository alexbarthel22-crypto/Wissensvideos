<!doctype html><html lang="de"><head><meta charset="utf-8"><style>
@font-face { font-family: "Lilita One"; src: url("LilitaOne-Regular.woff2") format("woff2"); }
:root{--ink:#2a1b12;--sand:#fff4e0;--sun:#ffd23f;--hib:#e8467c;--lagoon:#0fb3b0;--leaf:#2e9e5b}
*{box-sizing:border-box;margin:0} body{width:1080px;height:1350px;overflow:hidden;position:relative;font-family:Inter,system-ui,sans-serif;color:var(--ink)}
#bg{position:absolute;inset:0;background:url("bg_haupt.jpg") center 45%/1080px 1920px}
#bg::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 55%,rgba(0,0,0,0) 40%,rgba(4,40,70,.35))}
.stk{position:absolute;background:var(--sand);border:6px solid var(--ink);border-radius:34px;box-shadow:10px 10px 0 var(--ink)}
#logo{left:70px;top:70px;width:190px;height:190px;border-radius:50%;padding:12px;background:#fff;transform:rotate(-6deg)}
#logo svg{width:100%;height:100%}
#name{left:290px;top:95px;padding:10px 34px 16px;background:var(--sun);transform:rotate(-2deg)}
#name b{display:block;font-family:"Lilita One";font-size:104px;line-height:1}
#name small{display:block;font-weight:900;font-size:28px;letter-spacing:3px;margin-top:4px}
#hl{left:60px;right:60px;top:360px;padding:22px 30px 30px;background:var(--hib);text-align:center;transform:rotate(-1.5deg)}
#hl b{display:block;font-family:"Lilita One";font-size:112px;line-height:1.02;color:#fff;-webkit-text-stroke:9px var(--ink);paint-order:stroke fill}
#hl span{display:inline-block;margin-top:12px;font-weight:900;font-size:40px;color:#fff;background:var(--ink);border-radius:999px;padding:6px 26px 10px}
#gift{position:absolute;z-index:5;right:40px;top:250px;font-size:120px;filter:drop-shadow(8px 8px 0 var(--ink));transform:rotate(12deg)}
.card{top:760px;width:300px;height:250px;padding:22px 16px;text-align:center}
.card .ic{font-size:54px;line-height:1}
.card .n{display:inline-block;font-family:"Lilita One";font-size:76px;line-height:1;margin-top:8px;color:#fff;background:#ff6a1a;border:5px solid var(--ink);border-radius:20px;padding:4px 18px 10px;box-shadow:4px 4px 0 var(--ink)}
.card .l{font-weight:900;font-size:30px;margin-top:10px}
#c1{left:60px;transform:rotate(-2deg)} #c2{left:390px} #c3{left:720px;transform:rotate(2deg)}
#cta{left:0;right:0;margin:0 auto;width:fit-content;top:1110px;padding:14px 40px 18px;background:#fe2c55;color:#fff;font-weight:900;font-size:50px;border-radius:999px;text-align:center}
#cta small{display:block;font-size:30px;font-weight:800;opacity:.95;margin-top:2px}
</style></head><body>

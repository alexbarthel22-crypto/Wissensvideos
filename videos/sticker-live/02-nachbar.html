<!doctype html><html><head><meta charset="utf-8"><style>@font-face{font-family:L;src:url(LilitaOne-Regular.woff2)}*{margin:0;box-sizing:border-box}
html,body{background:transparent}body{width:600px;height:600px;display:grid;place-items:center}
.st{position:relative;width:520px;padding:58px 30px 38px;border-radius:70px;text-align:center;transform:rotate(var(--r));
 background:linear-gradient(150deg,var(--a),var(--b));box-shadow:0 0 0 14px #fff,0 0 0 22px #1a0f08,0 22px 0 8px rgba(0,0,0,.25)}
.st:after{content:"";position:absolute;inset:16px;border-radius:56px;background:repeating-conic-gradient(from 180deg at 50% -30%,rgba(255,255,255,.14) 0 5deg,transparent 5deg 14deg);pointer-events:none}
.e{position:absolute;left:50%;top:-78px;transform:translateX(-50%) rotate(calc(var(--r) * -2));font-size:118px;line-height:1;filter:drop-shadow(0 8px 0 rgba(0,0,0,.25))}
.lg{position:absolute;left:50%;top:-86px;transform:translateX(-50%);width:140px;height:140px;border-radius:50%;background:#fff;padding:8px;box-shadow:0 0 0 8px #1a0f08,0 8px 0 rgba(0,0,0,.25)}
.lg svg{width:100%;height:100%}
.t1{position:relative;font:400 86px/1 L;color:#fff;-webkit-text-stroke:12px #1a0f08;paint-order:stroke fill;white-space:nowrap}
.t2{position:relative;margin-top:10px;font:400 60px/1.05 L;color:#ffe14a;-webkit-text-stroke:10px #1a0f08;paint-order:stroke fill}
.sm .t2{font:900 40px/1.1 Inter,sans-serif;-webkit-text-stroke:0;color:#fff;text-shadow:0 3px 0 rgba(0,0,0,.35)}
.sp{position:absolute;color:#fff;text-shadow:0 0 10px #fff,0 0 20px #ffe14a;font-size:44px}</style></head><body>
<div class="st" style="--a:#2e9e5b;--b:#8be06a;--r:3deg"><div class="e">🛖</div><div class="t1" style="font-size:54px">NEUER NACHBAR!</div><div class="t2">Hütte bezogen ✓</div>
<div class="sp" style="left:-26px;top:20px">✦</div><div class="sp" style="right:-20px;bottom:-14px;font-size:36px">✦</div></div></body></html>

<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:L;src:url(LilitaOne-Regular.woff2)}
*{margin:0;box-sizing:border-box}
body{width:1080px;height:1920px;overflow:hidden;position:relative;font-family:Inter,system-ui,sans-serif;background:#0a6fb0}
.bg{position:absolute;inset:0;background:url(bg.svg) center/cover}
.sun{position:absolute;left:-200px;top:-260px;width:900px;height:900px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.35),rgba(255,255,255,0) 65%)}
.dc{position:absolute;filter:drop-shadow(0 6px 0 rgba(0,0,0,.18))}
.c{position:absolute;left:0;right:0;margin:0 auto;width:fit-content;text-align:center}
.stamp{top:270px;padding:8px 34px 14px;border:7px solid #ff2e7e;border-radius:22px;background:#fff;color:#ff2e7e;font:400 66px L;transform:rotate(-4deg);box-shadow:0 0 0 5px #1d2147,0 12px 0 rgba(0,0,0,.25)}
.h{top:420px;font:400 132px/1.0 L;color:#fff;-webkit-text-stroke:18px #1d2147;paint-order:stroke fill;filter:drop-shadow(0 10px 0 rgba(0,0,0,.25))}
.h b{font-weight:400;color:#ffe14d}
.sub{top:720px;width:920px;padding:22px 34px 26px;border-radius:34px;background:#ff2e7e;color:#fff;font:800 44px/1.25 Inter,sans-serif;box-shadow:0 0 0 6px #1d2147,0 12px 0 rgba(0,0,0,.3)}
.sub em{font-style:normal;color:#ffe14d}
.chips{top:990px;display:flex;flex-wrap:wrap;justify-content:center;gap:18px;width:960px}
.chip{padding:10px 26px 14px;border-radius:999px;background:#fff;color:#1d2147;font:900 38px Inter,sans-serif;box-shadow:0 0 0 5px #1d2147,0 8px 0 rgba(0,0,0,.25)}
.card{top:1250px;width:920px;padding:26px 30px 30px;border-radius:36px;background:#fff;color:#1d2147;font:900 54px/1.15 Inter,sans-serif;box-shadow:0 0 0 7px #1d2147,0 14px 0 rgba(0,0,0,.3)}
.card small{display:block;font:800 36px Inter,sans-serif;color:#0a8fb0;margin-top:10px}
</style></head><body>
<div class="bg"></div><div class="sun"></div><div class="dc" style="left:90px;top:1640px;font-size:64px;transform:rotate(-20deg)">🐚</div><div class="dc" style="left:930px;top:1600px;font-size:60px;transform:rotate(15deg)">⭐</div><div class="dc" style="left:160px;top:1820px;font-size:58px;transform:rotate(0deg)">🦀</div><div class="dc" style="left:820px;top:1830px;font-size:52px;transform:rotate(25deg)">🐚</div><div class="dc" style="left:-30px;top:1380px;font-size:170px;transform:rotate(-10deg)">🌴</div><div class="dc" style="left:930px;top:1340px;font-size:170px;transform:rotate(12deg)">🌴</div><div class="dc" style="left:80px;top:330px;font-size:50px;transform:rotate(0deg)">🫧</div><div class="dc" style="left:960px;top:560px;font-size:44px;transform:rotate(0deg)">🫧</div><div class="dc" style="left:70px;top:1110px;font-size:40px;transform:rotate(0deg)">🫧</div><div class="dc" style="left:990px;top:1150px;font-size:52px;transform:rotate(0deg)">🫧</div>
<div class="c stamp">🎮 TEST-PERSONEN GESUCHT!</div>
<div class="c h">Teste die<br><b>Spielwelt!</b></div>
<div class="c sub">Ich suche Leute, die die <em style="white-space:nowrap">neue Spiel-Umgebung</em> von <span style="white-space:nowrap">Muschel-Tal</span> als Erste testen 🏝️</div>
<div class="c chips"><div class="chip">🚶 Herumlaufen</div><div class="chip">🗺️ Erkunden</div><div class="chip">🐞 Fehler finden</div></div>
<div class="c card">Interesse? Schreib mir! 💬🐚<small>Ich melde mich mit allen Infos bei dir</small></div>
</body></html>

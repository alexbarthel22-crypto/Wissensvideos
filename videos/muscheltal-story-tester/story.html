<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:L;src:url(LilitaOne-Regular.woff2)}
*{margin:0;box-sizing:border-box}
body{width:1080px;height:1920px;overflow:hidden;position:relative;font-family:Inter,system-ui,sans-serif}
.bg{position:absolute;inset:0;background:url(bg.png) center 62%/cover}
.tint{position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,70,130,.55) 0%,rgba(10,70,130,.15) 30%,rgba(0,0,0,0) 40%,rgba(0,0,0,0) 66%,rgba(40,25,10,.45) 82%,rgba(40,25,10,.7) 100%)}
.c{position:absolute;left:0;right:0;margin:0 auto;width:fit-content;text-align:center}
.stamp{top:250px;padding:8px 30px 12px;border:6px solid #e8262f;border-radius:20px;background:#fff;color:#e8262f;font:400 58px L;transform:rotate(-4deg);box-shadow:0 10px 0 rgba(0,0,0,.25)}
.h{top:380px;font:400 120px/1.02 L;color:#fff;-webkit-text-stroke:16px #1d2147;paint-order:stroke fill}
.h b{font-weight:400;color:#ffe14d}
.sub{top:640px;width:900px;padding:18px 30px 22px;border-radius:30px;background:#e8262f;color:#fff;font:800 42px/1.25 Inter,sans-serif;box-shadow:0 0 0 5px #1d2147,0 10px 0 rgba(0,0,0,.3)}
.sub em{font-style:normal;color:#ffe14d}
.slots{top:1340px;display:flex;gap:18px}
.slot{width:120px;height:120px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:66px;box-shadow:0 0 0 6px #ffd23f,0 0 0 11px #1d2147,0 10px 16px rgba(0,0,0,.3)}
.card{top:1510px;width:920px;padding:24px 30px 28px;border-radius:34px;background:#fff;color:#1d2147;font:900 46px/1.2 Inter,sans-serif;box-shadow:0 0 0 6px #1d2147,0 12px 0 rgba(0,0,0,.3)}
.card small{display:block;font:800 34px Inter,sans-serif;color:#e2560c;margin-top:8px}
</style></head><body>
<div class="bg"></div><div class="tint"></div>
<div class="c stamp">🎮 TESTER GESUCHT!</div>
<div class="c h">Ich suche<br><b>5 Leute</b></div>
<div class="c sub">die die <em>zukünftige spielerische Welt</em> von Muschel-Tal auf Herz und Nieren prüfen</div>
<div class="c slots"><div class="slot">❔</div><div class="slot">❔</div><div class="slot">❔</div><div class="slot">❔</div><div class="slot">❔</div></div>
<div class="c card">Interesse? Meld dich bei mir! 🤍🐚<small>Mehr Infos auf Anfrage</small></div>
</body></html>

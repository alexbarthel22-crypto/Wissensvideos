<!doctype html>
<html lang="de" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0a0c1d; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: url("bg.png") center / cover; }
      .abs { position: absolute; }
      #shade { left: 0; top: 0; width: 1080px; height: 1920px; background: linear-gradient(rgba(10,12,30,.75), rgba(10,12,30,.1) 32%, rgba(10,12,30,.1) 62%, rgba(10,12,30,.7)); }
      #t { left: 50px; right: 50px; top: 250px; text-align: center; color: #fff; font: 500 86px/1.12 "EB Garamond", "Liberation Serif", serif; text-shadow: 0 3px 20px rgba(0,0,0,.6); }
      #t em { font-style: normal; color: #ff8fd0; }
      #chip { left: 120px; top: 1290px; width: 840px; text-align: center; padding: 18px 24px; border-radius: 22px; background: rgba(255,255,255,.94); color: #22283f;
        font: 500 52px/1.15 "EB Garamond", serif; box-shadow: 0 18px 50px rgba(0,0,0,.4); transform: rotate(-2deg); }
      #chip b { color: #e0484f; font-weight: 600; }
      #q { left: 60px; width: 960px; top: 1480px; height: 170px; border-radius: 26px; background: rgba(10,12,30,.82); border: 5px solid #ffd56b;
        text-align: center; color: #fff; font: 600 66px/160px "EB Garamond", serif; }
      #q span { color: #ffd56b; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="cover" data-start="0" data-duration="1" data-width="1080" data-height="1920" data-no-timeline>
      <div id="shade" class="abs"></div>
      <div id="t" class="abs">Was wäre, wenn du nicht mehr stundenlang auf <em>TikTok</em> wärst?</div>
      <div id="chip" class="abs">Tag 1: <b>Dein Zimmer hat Fenster.</b></div>
      <div id="q" class="abs"><span>578 Stunden</span> zurück – pro Jahr?</div>
    </div>
  </body>
</html>

<!doctype html><html lang="de"><head><meta charset="utf-8"><style>
@font-face { font-family: "Lilita One"; src: url("LilitaOne-Regular.woff2") format("woff2"); }
:root{--ink:#2a1b12;--sand:#fff4e0;--sun:#ffd23f;--hib:#e8467c;--lagoon:#0fb3b0;--leaf:#2e9e5b}
*{box-sizing:border-box;margin:0} body{width:1080px;height:1920px;overflow:hidden;position:relative;font-family:Inter,system-ui,sans-serif;color:var(--ink)}
#bg{position:absolute;inset:0;background:url("bg.jpg") center/cover}
#bg::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,244,224,0) 30%,rgba(255,244,224,.0) 45%,rgba(42,27,18,.35) 100%)}
.stk{position:absolute;background:var(--sand);border:6px solid var(--ink);border-radius:34px;box-shadow:10px 10px 0 var(--ink)}
#logo{left:170px;top:330px;width:200px;height:200px;border-radius:50%;padding:12px;background:#fff;transform:rotate(-6deg)}
#logo svg{width:100%;height:100%}
#tag{left:400px;top:360px;padding:6px 34px 12px;background:var(--sun);font-family:"Lilita One";font-size:110px;line-height:1;transform:rotate(-3deg);border-radius:30px}
#tag small{font-family:Inter;font-weight:900;font-size:30px;display:block;letter-spacing:2px;margin-top:2px}
#hl{left:60px;right:60px;top:610px;padding:20px 30px 30px;background:var(--hib);text-align:center;transform:rotate(-2deg)}
#hl b{display:block;font-family:"Lilita One";font-size:128px;line-height:1;color:#fff;-webkit-text-stroke:10px var(--ink);paint-order:stroke fill}
#hl span{display:inline-block;margin-top:8px;font-weight:900;font-size:40px;color:#fff;background:var(--ink);border-radius:999px;padding:4px 22px 8px}
#coco{position:absolute;right:120px;top:350px;font-size:140px;filter:drop-shadow(8px 8px 0 var(--ink));transform:rotate(14deg)}
.card{top:1000px;width:460px;height:330px;padding:26px 26px 20px;text-align:center}
#c1{left:56px;transform:rotate(-2deg)} #c2{left:564px;transform:rotate(2deg)}
.card .ic{font-size:64px;line-height:1}
.card .n{display:inline-block;font-family:"Lilita One";font-size:110px;line-height:1;margin-top:8px;color:#fff;background:#ff6a1a;border:5px solid var(--ink);border-radius:24px;padding:6px 26px 12px;box-shadow:5px 5px 0 var(--ink)}
.card .l{font-weight:900;font-size:40px;margin-top:10px}
.card .d{position:absolute;right:-16px;top:-26px;background:var(--leaf);color:#fff;font-weight:900;font-size:46px;padding:4px 20px 8px;border:5px solid var(--ink);border-radius:999px;transform:rotate(6deg)}
.card .v{font-weight:800;font-size:26px;color:#7a5a45;margin-top:4px}
#acc{left:0;right:0;margin:0 auto;width:fit-content;top:1410px;padding:8px 30px 12px;font-weight:900;font-size:46px;background:#fff;border-radius:999px}
</style></head><body>

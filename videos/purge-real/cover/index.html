<!doctype html>
<html lang="de" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #07091a; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: url("bg.png") center / cover; }
      .abs { position: absolute; }
      #shade { left: 0; top: 1050px; width: 1080px; height: 870px; background: linear-gradient(rgba(7,9,26,0), rgba(7,9,26,.85) 30%, #07091a); }
      #red { left: 0; top: 0; width: 1080px; height: 1920px; background: radial-gradient(ellipse 70% 40% at 50% 55%, rgba(200,16,46,.28), rgba(200,16,46,0)); }
      #t1 { left: 0; width: 1080px; top: 1190px; text-align: center; font: 700 200px/1 Oswald, sans-serif; color: #ff3b55; letter-spacing: .02em;
        text-shadow: 0 0 60px rgba(255,59,85,.7), 0 10px 0 rgba(0,0,0,.7); }
      #t2 { left: 0; width: 1080px; top: 1400px; text-align: center; font: 700 68px/1.1 Oswald, sans-serif; color: #fff; text-shadow: 0 6px 0 rgba(0,0,0,.7); }
      #q { left: 90px; width: 900px; top: 1530px; height: 120px; border-radius: 18px; background: rgba(8,8,16,.85); border: 4px solid #ffd43b;
        text-align: center; font: 700 46px/112px Oswald, sans-serif; color: #fff; letter-spacing: .01em; white-space: nowrap; }
      #q span { color: #ffd43b; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="cover" data-start="0" data-duration="1" data-width="1080" data-height="1920" data-no-timeline>
      <div id="red" class="abs"></div><div id="shade" class="abs"></div>
      <div id="t1" class="abs">THE PURGE</div>
      <div id="t2" class="abs">WAS WÄRE, WENN ES ECHT WÄRE?</div>
      <div id="q" class="abs"><span>12 STUNDEN</span> · ALLES LEGAL · KEIN NOTRUF</div>
    </div>
  </body>
</html>

<!doctype html>
<html lang="de" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #07091a; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: url("bg.png") center / cover; }
      .abs { position: absolute; }
      #shade { left: 0; top: 1180px; width: 1080px; height: 740px; background: linear-gradient(rgba(7,9,26,0), rgba(7,9,26,.9) 25%, #07091a); }
      .chip { left: 0; right: 0; margin: 0 auto; width: fit-content; padding: 8px 26px; border-radius: 12px; font: 700 50px/1.1 Oswald, sans-serif; letter-spacing: .03em; white-space: nowrap; }
      #c1 { top: 1270px; background: #ff3b55; color: #fff; transform: rotate(-2deg); box-shadow: 0 0 40px rgba(255,59,85,.6); }
      #c2 { top: 1370px; border: 4px solid #39e27a; color: #39e27a; background: rgba(8,8,16,.85); transform: rotate(1.5deg); }
      #q { left: 70px; width: 940px; top: 1500px; height: 150px; border-radius: 22px; background: rgba(8,8,16,.9); border: 5px solid #ffd43b; box-shadow: 0 0 50px rgba(255,212,59,.35);
        text-align: center; font: 700 60px/140px Oswald, sans-serif; color: #fff; white-space: nowrap; }
      #q span { color: #ffd43b; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="cover" data-start="0" data-duration="1" data-width="1080" data-height="1920" data-no-timeline>
      <div id="shade" class="abs"></div>
      <div id="c1" class="abs chip">RAUB · MORD · BRAND – ALLES LEGAL</div>
      <div id="c2" class="abs chip">+ 4 SCHRITTE, WIE DU ÜBERLEBST</div>
      <div id="q" class="abs"><span>TEILNEHMEN</span> ODER VERSCHANZEN?</div>
    </div>
  </body>
</html>

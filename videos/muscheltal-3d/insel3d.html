 R.shadowMap.enabled=true;R.shadowMap.type=THREE.PCFSoftShadowMap;R.outputEncoding=THREE.LinearEncoding;R.toneMapping=THREE.NoToneMapping;R.shadowMap.autoUpdate=true;

  const gg=new THREE.ExtrudeGeometry(sh2,{depth:Math.max(.01,d-2*r),bevelEnabled:true,bevelThickness:r,bevelSize:r,bevelOffset:0,bevelSegments:3,curveSegments:3});gg.translate(0,0,-(d-2*r)/2);gg.computeVertexNormals();return boxUV(gg,w,h,d);};
 const BOX=(w,h,d,eckig)=>geo((eckig?'B':'b')+w+','+h+','+d,()=>eckig?new THREE.BoxGeometry(w,h,d):RBOX(w,h,d)),CYL=(a,b,h,n=12)=>geo('c'+a+','+b+','+h+','+n,()=>new THREE.CylinderGeometry(a,b,h,n)),SPH=(r,n=12)=>geo('s'+r+','+n,()=>new THREE.SphereGeometry(r,n,Math.max(6,n*.7|0))),CONE=(r,h,n=12)=>geo('k'+r+','+h+','+n,()=>new THREE.ConeGeometry(r,h,n));
 // Bootsrumpf: Deck-Umriss (spitzer Bug bei -x, runder Spiegel bei +x), nach unten V-förmig verjüngt, weiß/blau mit Goldstreifen (Vertex-Farben)
 const rumpf=(Lg,B,Hh,cOben=0xffffff,cUnten=0x24407a)=>geo('rumpf'+Lg+','+B+','+Hh+','+cOben+','+cUnten,()=>{const s2=new THREE.Shape(),r=Math.min(3,B*.15);s2.moveTo(Lg/2-r,-B/2);s2.quadraticCurveTo(Lg/2,-B/2,Lg/2,-B/2+r);s2.lineTo(Lg/2,B/2-r);s2.quadraticCurveTo(Lg/2,B/2,Lg/2-r,B/2);s2.lineTo(-Lg*.12,B/2);s2.quadraticCurveTo(-Lg*.4,B/2*.96,-Lg/2,0);s2.quadraticCurveTo(-Lg*.4,-B/2*.96,-Lg*.12,-B/2);s2.closePath();

  gg.computeBoundingBox();const yT=gg.boundingBox.max.y,yB=gg.boundingBox.min.y;for(let i=0;i<p.count;i++){const y=p.getY(i),f=Math.max(0,Math.min(1,(yT-y)/(yT-yB)));p.setZ(i,p.getZ(i)*(1-.5*f*f));const bx=Math.max(0,(-p.getX(i)-Lg*.3)/(Lg*.2));p.setY(i,y+bx*bx*Hh*.18);const k=f>.5?cu:(f>.36&&f<.42?cg:co);c[i*3]=k.r;c[i*3+1]=k.g;c[i*3+2]=k.b;}

 const add=(geom,mat,x,y,z,o={},par=sc)=>{const m=new THREE.Mesh(geom,mat);m.position.set(x,y,z);if(o.ry)m.rotation.y=o.ry;if(o.rx)m.rotation.x=o.rx;if(o.rz)m.rotation.z=o.rz;if(o.s)m.scale.set(...o.s);m.castShadow=o.cast!==false;m.receiveShadow=true;par.add(m);return m;};

 const THATCH=tex(128,128,(x,w,h)=>{x.fillStyle='#e8c25a';x.fillRect(0,0,w,h);for(let i=0;i<260;i++){x.strokeStyle=['#c99a3a','#f3d27a','#b8862f','#e0b44c'][i%4];x.lineWidth=1+rnd(i,1)*1.5;const a=rnd(i,2)*w,b=rnd(i,3)*h;x.beginPath();x.moveTo(a,b);x.lineTo(a+(rnd(i,4)-.5)*6,b+14+rnd(i,5)*10);x.stroke();}});

 const GRASS=tex(256,256,(x,w,h)=>{x.fillStyle=KOK?'#6aa843':'#5aae3c';x.fillRect(0,0,w,h);for(let i=0;i<1400;i++){x.fillStyle=['#4f9a34','#66b947','#73c454','#57a63c'][i%4];x.fillRect(rnd(i,1)*w,rnd(i,2)*h,2,3);}},[60,60]);

 LOG('// ---------- Wasser ---------');
 // ---------- Wasser ----------
 // Normalenkarte für die Wellen (aus überlagerten Sinuswellen berechnet)
 const WN=(()=>{const n=256,c=document.createElement('canvas');c.width=c.height=n;const x=c.getContext('2d'),im=x.createImageData(n,n),W8=[[1,0],[0,1],[1,1],[2,-1],[3,1],[1,-3],[4,3],[-3,5],[6,1],[2,7],[7,-4],[5,6]],Hh=(i,j)=>{let h=0;W8.forEach(([a,b],k)=>{h+=Math.sin((i*a+j*b)*Math.PI*2/n+k*1.9)/Math.hypot(a,b);});return h;};// ganzzahlige Wellenvektoren: nahtlos kachelbar

 // Meer: blau, glänzend, mit wandernden Wellen (Normalenkarte) und Umgebungsspiegelung

 {const n=120,P=[],C=[],I=[],RR=[0,0,.5,1.2,2.6,8];for(let i=0;i<=n;i++){const a=i/n*Math.PI*2;RR.forEach((f,k)=>{const r=k===0?0:coastAt(v,a)+BEX+60+f*90;P.push(v.x+Math.cos(a)*r,k===0?-12:-8-(k-1)*3,v.y+Math.sin(a)*r);const c=new THREE.Color([0x7fd8d0,0x3fb8c8,0x1a7fa8,0x0d5a88,0x083e6a,0x062c50][k]).convertSRGBToLinear();C.push(c.r,c.g,c.b);});}

 // Wasseroberfläche: fein unterteilt, sanfte Dünung im Shader, zwei Wellen-Normalenlagen, leicht durchsichtig
 const WAVE={value:0};

 const AUGE=TOP+9.4;let egoCurve=null,egoLen=0,egoYaw=0;const mkRoute=(()=>{try{return g('mkRoute');}catch(e){return null;}})(),canWalk=(()=>{try{return g('canWalk');}catch(e){return null;}})();

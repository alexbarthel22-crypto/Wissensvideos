<body>
<!-- 3D-Ansicht von Muschel-Tal nur für Videos (nicht auf der Homepage verlinkt).

                ?winkel=Grad · ?hoehe=0..1 · ?zoom=Faktor · ?ziel=x,y (Kameraziel in Kartenkoordinaten) · ?w=1080&h=1920
     Aufnehmen: lokaler Webserver ab dem Repo-Ordner (python3 -m http.server 8077) →
     http://localhost:8077/videos/muscheltal-3d/insel3d.html?flug=1 – window.BEREIT ist true, sobald alles steht. -->
<div id="lade">🐚 Muschel-Tal wird gebaut …</div>
<canvas id="c"></canvas>
<iframe id="src" src="../../muscheltal/site/index.html?zeit=tag&wetter=sonne"></iframe>
<script src="lib/three.min.js"></script>
<script src="lib/OrbitControls.js"></script>
<script>
const LIN=c=>new THREE.Color(c).convertSRGBToLinear();
const Q=new URLSearchParams(location.search),INSEL=+(Q.get('insel')||0),NACHT=Q.get('zeit')==='nacht',FLUG=Q.get('flug')==='1',NAME=(Q.get('name')||'').toLowerCase().replace(/^@?/,'@');
const FW=+Q.get('w')||0,FH=+Q.get('h')||0;window.BEREIT=false;
const src=document.getElementById('src');
function warte(){const W=src.contentWindow;try{if(W&&W.eval&&W.eval("typeof PEOPLE!=='undefined'&&PEOPLE.length>0&&typeof ISL!=='undefined'&&ISL[0].plots&&ISL[0].plots.length>0&&typeof OBS!=='undefined'"))return baue(W);}catch(e){}setTimeout(warte,200);}
src.onload=()=>setTimeout(warte,300);
const rnd=(i,k)=>{const x=Math.sin(i*127.1+k*311.7)*43758.5453;return x-Math.floor(x);};

function baue(W){
 const g=n=>W.eval(n);
 try{g('canWalk(0,0)');}catch(e){}// Hindernis-Liste (OBS) anlegen lassen
 const ISL=g('ISL'),PEOPLE=g('PEOPLE'),GEB=g('GEB'),S=g('S'),PAL_S=g('PAL_S'),BEX=g('BEX'),coastAt=g('coastAt'),inside=g('inside'),limit=g('limit'),LANT=g('LANT'),BAU=g('BAU'),YACHT=g('YACHT'),OBS=g('OBS')||[],look=g('look'),WALKERS=g('WALKERS'),walkBounds=g('walkBounds'),polar=g('polar'),PIER_A=g('PIER_A');
 let teamPos=null,kioPos=null,KIO=null;try{teamPos=g('teamPos');kioPos=g('kioPos');KIO=g('KIO');}catch(e){}
 try{W.cancelAnimationFrame(g('fly'));}catch(e){}
 const v=ISL[INSEL]||ISL[0],KOK=v.i===1,MAINI=v===ISL[0];
 // ---------- Renderer, Szene, Licht ----------
 const cv=document.getElementById('c'),R=new THREE.WebGLRenderer({canvas:cv,antialias:true,preserveDrawingBuffer:true});
 const cam=new THREE.PerspectiveCamera(36,1,3,v.R*14);
 const setSize=()=>{const w=FW||innerWidth,h=FH||innerHeight;R.setPixelRatio(FW?1:Math.min(2,devicePixelRatio));R.setSize(w,h,!FW);if(FW){cv.style.width='100%';cv.style.height='100%';cv.style.objectFit='contain';}cam.aspect=w/h;cam.updateProjectionMatrix();};
 R.shadowMap.enabled=true;R.shadowMap.type=THREE.PCFSoftShadowMap;R.outputEncoding=THREE.sRGBEncoding;R.toneMapping=THREE.ACESFilmicToneMapping;R.toneMappingExposure=1;
 const sc=new THREE.Scene(),SKY=NACHT?0x0c1a3a:0x9fd8f0;sc.background=LIN(SKY);sc.fog=new THREE.Fog(LIN(SKY),v.R*2.6,v.R*6);
 sc.add(new THREE.HemisphereLight(LIN(NACHT?0x6a7fc0:0xdff4ff),LIN(NACHT?0x1a2a20:0x6a9050),NACHT?.5:.6));
 const sun=new THREE.DirectionalLight(LIN(NACHT?0x9fb4ff:0xfff1d6),NACHT?.4:1.6);sun.position.set(v.x-v.R*.8,v.R*1.4,v.y-v.R*.6);sun.target.position.set(v.x,0,v.y);sc.add(sun,sun.target);
 sun.castShadow=true;sun.shadow.mapSize.set(4096,4096);const sh=sun.shadow.camera;sh.left=sh.bottom=-v.R*1.35;sh.right=sh.top=v.R*1.35;sh.near=10;sh.far=v.R*5;sun.shadow.bias=-.0004;sun.shadow.normalBias=.6;
 // Materialien werden je Farbe nur einmal angelegt
 const MC=new Map();const M=(c,o={})=>{const k=c+JSON.stringify(o);if(MC.has(k))return MC.get(k);const m=new THREE.MeshStandardMaterial({roughness:.85,metalness:0,...o,color:LIN(c),...(o.emissive!=null?{emissive:LIN(o.emissive)}:{})});MC.set(k,m);return m;};
 const GC=new Map();const geo=(k,f)=>{if(!GC.has(k))GC.set(k,f());return GC.get(k);};
 const BOX=(w,h,d)=>geo('b'+w+','+h+','+d,()=>new THREE.BoxGeometry(w,h,d)),CYL=(a,b,h,n=12)=>geo('c'+a+','+b+','+h+','+n,()=>new THREE.CylinderGeometry(a,b,h,n)),SPH=(r,n=12)=>geo('s'+r+','+n,()=>new THREE.SphereGeometry(r,n,Math.max(6,n*.7|0))),CONE=(r,h,n=12)=>geo('k'+r+','+h+','+n,()=>new THREE.ConeGeometry(r,h,n));
 const add=(geom,mat,x,y,z,o={},par=sc)=>{const m=new THREE.Mesh(geom,mat);m.position.set(x,y,z);if(o.ry)m.rotation.y=o.ry;if(o.rx)m.rotation.x=o.rx;if(o.rz)m.rotation.z=o.rz;if(o.s)m.scale.set(...o.s);m.castShadow=o.cast!==false;m.receiveShadow=true;par.add(m);return m;};
 const TOP=3.05;

 // ---------- Texturen (Canvas) ----------
 const tex=(w,h,f,rep)=>{const c=document.createElement('canvas');c.width=w;c.height=h;f(c.getContext('2d'),w,h);const t=new THREE.CanvasTexture(c);t.encoding=THREE.sRGBEncoding;t.anisotropy=8;if(rep){t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(...rep);}return t;};
 const THATCH=tex(128,128,(x,w,h)=>{x.fillStyle='#e8c25a';x.fillRect(0,0,w,h);for(let i=0;i<260;i++){x.strokeStyle=['#c99a3a','#f3d27a','#b8862f','#e0b44c'][i%4];x.lineWidth=1+rnd(i,1)*1.5;const a=rnd(i,2)*w,b=rnd(i,3)*h;x.beginPath();x.moveTo(a,b);x.lineTo(a+(rnd(i,4)-.5)*6,b+14+rnd(i,5)*10);x.stroke();}});
 const PLANK=tex(64,64,(x,w,h)=>{x.fillStyle='#d9a066';x.fillRect(0,0,w,h);for(let i=0;i<8;i++){x.fillStyle=i%2?'#cf9459':'#e0ab72';x.fillRect(i*8,0,8,h);x.fillStyle='rgba(90,50,20,.35)';x.fillRect(i*8,0,1,h);}});
 const GRASS=tex(256,256,(x,w,h)=>{x.fillStyle=KOK?'#6aa843':'#5aae3c';x.fillRect(0,0,w,h);for(let i=0;i<1400;i++){x.fillStyle=['#4f9a34','#66b947','#73c454','#57a63c'][i%4];x.fillRect(rnd(i,1)*w,rnd(i,2)*h,2,3);}},[60,60]);
 const SAND=tex(256,256,(x,w,h)=>{x.fillStyle='#f2dca6';x.fillRect(0,0,w,h);for(let i=0;i<1500;i++){x.fillStyle=['#e8cf92','#fbe8bd','#dcc184'][i%3];x.fillRect(rnd(i,3)*w,rnd(i,4)*h,2,2);}},[40,40]);
 const STONE=tex(256,256,(x,w,h)=>{x.fillStyle='#ddd2bd';x.fillRect(0,0,w,h);x.strokeStyle='rgba(120,100,80,.35)';x.lineWidth=2;for(let r=0;r<8;r++)for(let c=0;c<8;c++){x.strokeRect(c*32+(r%2)*16,r*32,32,32);}},[18,18]);

 // ---------- Wasser ----------
 const wgeo=new THREE.PlaneGeometry(v.R*14,v.R*14,140,140);wgeo.rotateX(-Math.PI/2);
 const water=new THREE.Mesh(wgeo,new THREE.MeshStandardMaterial({color:LIN(NACHT?0x123a6a:0x24a9d0),roughness:.18,metalness:.15,transparent:true,opacity:.97}));water.position.set(v.x,-3,v.y);water.receiveShadow=true;sc.add(water);

 // ---------- Insel: Riff, Sand, Gras ----------
 const ring=(rf,n=200)=>{const s=new THREE.Shape();for(let i=0;i<=n;i++){const a=i/n*Math.PI*2-Math.PI,r=rf(a),x=v.x+Math.cos(a)*r,y=v.y+Math.sin(a)*r;i?s.lineTo(x,-y):s.moveTo(x,-y);}return s;};
 const plate=(shape,h,mat,y,uv)=>{const gg=new THREE.ExtrudeGeometry(shape,{depth:h,bevelEnabled:true,bevelThickness:1.5,bevelSize:2.5,bevelSegments:3,curveSegments:8});gg.rotateX(-Math.PI/2);const m=new THREE.Mesh(gg,mat);m.position.y=y;m.receiveShadow=true;sc.add(m);return m;};
 plate(ring(a=>coastAt(v,a)+BEX+34),3,new THREE.MeshStandardMaterial({color:LIN(0x7fe0ee),roughness:.3,transparent:true,opacity:.5}),-3.3);
 const sandM=new THREE.MeshStandardMaterial({color:0xffffff,map:SAND,roughness:.95});SAND.repeat.set(.02,.02);
 plate(ring(a=>coastAt(v,a)+BEX+16),5,sandM,-4);
 const grasM=new THREE.MeshStandardMaterial({color:0xffffff,map:GRASS,roughness:1});GRASS.repeat.set(.03,.03);
 plate(ring(a=>coastAt(v,a)),4,grasM,-2.6);
 // Wege und Platz
 const ok=(x,y)=>inside(v,x,y,-4)&&Math.hypot(x-v.x,y-v.y)>v.plaza+2&&!GEB.some(b=>x>b.x0+2&&x<b.x1-2&&y>b.y0+2&&y<b.y1-2);
 const paths=[],G=Math.ceil(v.R/S)+2;
 for(let k=-G;k<=G;k++){if(((k%5)+5)%5)continue;const x=v.x+k*S;for(let y=v.y-v.R;y<v.y+v.R;y+=4)if(ok(x,y))paths.push([x,y,7.2,4.2]);}
 for(let m=-G;m<=G;m++){if(((m%4)+4)%4)continue;const y=v.y+m*S*.9;for(let x=v.x-v.R;x<v.x+v.R;x+=4)if(ok(x,y))paths.push([x,y,4.2,7.2]);}
 const inst=(gm,mat,n,f,shadow=true)=>{const im=new THREE.InstancedMesh(gm,mat,n),o=new THREE.Object3D();im.castShadow=shadow;im.receiveShadow=true;for(let i=0;i<n;i++){o.position.set(0,0,0);o.rotation.set(0,0,0);o.scale.set(1,1,1);f(i,o);o.updateMatrix();im.setMatrixAt(i,o.matrix);}sc.add(im);return im;};
 inst(BOX(1,.5,1),M(KOK?0x9a6a3a:0xdcc08a),paths.length,(i,o)=>{const [x,y,w,d]=paths[i];o.position.set(x,TOP+.05,y);o.scale.set(w,1,d);},false);
 // Kieselsteine auf den Wegen
 inst(SPH(.35,6),M(0xc9b48a),Math.min(3000,paths.length),(i,o)=>{const [x,y]=paths[(i*7)%paths.length];o.position.set(x+(rnd(i,1)-.5)*6,TOP+.35,y+(rnd(i,2)-.5)*6);},false);
 const platzM=new THREE.MeshStandardMaterial({color:LIN(KOK?0xf0dcaa:0xffffff),map:KOK?null:STONE,roughness:.9});
 add(new THREE.CylinderGeometry(v.plaza+2,v.plaza+3,1.2,72),platzM,v.x,TOP-.1,v.y,{cast:false});
 if(!KOK)for(let k=0;k<24;k++){const a=k/24*Math.PI*2;add(BOX(.5,.7,v.plaza*.95),M(0xc8bba2),v.x+Math.cos(a)*v.plaza*.5,TOP+.55,v.y+Math.sin(a)*v.plaza*.5,{ry:-a+Math.PI/2,cast:false});}

 // ---------- Hütten ----------
 const H=PEOPLE.filter(p=>p.p&&!p.gb&&p.isl===v&&p.nr<=limit);
 const col=new THREE.Color(),win=[];
 if(!KOK){
  inst(BOX(.9,4.4,.9),M(0x6b4423),H.length*4,(i,o)=>{const p=H[i>>2],k=i&3;o.position.set(p.p.x+(k&1?-5.2:5.2),TOP+2.2,p.p.y-2+(k&2?-3.4:3.4));});
  inst(BOX(14,.8,10.5),M(0x8a5a2b),H.length,(i,o)=>{const p=H[i];o.position.set(p.p.x,TOP+4.4,p.p.y-2);});// Plattform
  const plankM=new THREE.MeshStandardMaterial({color:0xffffff,map:PLANK,roughness:.9});
  const body=inst(BOX(12,6.6,8.6),plankM,H.length,(i,o)=>{const p=H[i];o.position.set(p.p.x,TOP+8.1,p.p.y-2);});
  H.forEach((p,i)=>body.setColorAt(i,col.set(p.wall||'#d9a066').lerp(new THREE.Color(1,1,1),.35).convertSRGBToLinear()));body.instanceColor.needsUpdate=true;
  const thatchM=new THREE.MeshStandardMaterial({color:0xffffff,map:THATCH,roughness:1});
  const sq=H.filter(p=>!p.round),rd=H.filter(p=>p.round),TH=[0xffffff,0xf2e2b8,0xffefc4];
  const r1=inst(new THREE.ConeGeometry(10.8,9.4,4,1),thatchM,sq.length,(i,o)=>{const p=sq[i];o.position.set(p.p.x,TOP+16.1,p.p.y-2);o.rotation.set(0,Math.PI/4,0);o.scale.set(1,1,.84);});
  sq.forEach((p,i)=>r1.setColorAt(i,col.setHex(TH[(p.nr*7)%3])));r1.instanceColor.needsUpdate=true;
  const r2=inst(new THREE.SphereGeometry(9.2,22,12,0,Math.PI*2,0,Math.PI/2),thatchM,rd.length,(i,o)=>{const p=rd[i];o.position.set(p.p.x,TOP+11.3,p.p.y-2);o.scale.set(1,1.1,.86);});
  rd.forEach((p,i)=>r2.setColorAt(i,col.setHex(TH[(p.nr*5)%3])));r2.instanceColor.needsUpdate=true;
  inst(BOX(3,4.8,.4),M(0x4a2a14),H.length,(i,o)=>{const p=H[i];o.position.set(p.p.x-1.6,TOP+7.2,p.p.y+2.35);});// Tür
  inst(BOX(3.6,.5,.5),M(0x6b4423),H.length,(i,o)=>{const p=H[i];o.position.set(p.p.x-1.6,TOP+9.85,p.p.y+2.4);});
  const WN=H.filter(p=>p.win!==false);
  inst(BOX(2.6,2.4,.3),M(0x2a1b12,NACHT?{emissive:0xffb040,emissiveIntensity:1.4}:{}),WN.length,(i,o)=>{const p=WN[i];o.position.set(p.p.x+3,TOP+8.6,p.p.y+2.35);});
  const sh2=inst(BOX(1.2,2.6,.3),M(0xffffff),WN.length*2,(i,o)=>{const p=WN[i>>1];o.position.set(p.p.x+3+(i&1?1.95:-1.95),TOP+8.6,p.p.y+2.4);});
  WN.forEach((p,i)=>{col.set(p.roof||'#e8467c').convertSRGBToLinear();sh2.setColorAt(i*2,col);sh2.setColorAt(i*2+1,col);});sh2.instanceColor.needsUpdate=true;
  // Treppe vor der Tür
  inst(BOX(3,.5,1.4),M(0x8a5a2b),H.length*2,(i,o)=>{const p=H[i>>1],k=i&1;o.position.set(p.p.x-1.6,TOP+1.2+k*1.6,p.p.y+4.2-k*1.1);});
  // Blumentöpfe (bei jeder dritten Hütte)
  const POT=H.filter(p=>rnd(p.nr,9)<.38);
  inst(CYL(1,.8,1.6,10),M(0xc8643c),POT.length,(i,o)=>{const p=POT[i];o.position.set(p.p.x+5.6,TOP+.8,p.p.y+4.6);});
  const fl=inst(SPH(1.2,8),M(0xffffff),POT.length,(i,o)=>{const p=POT[i];o.position.set(p.p.x+5.6,TOP+2.2,p.p.y+4.6);o.scale.set(1,.8,1);});
  POT.forEach((p,i)=>fl.setColorAt(i,col.setHex([0xff6fa3,0xffd23f,0xe8433c,0xb58ad0,0xffffff][p.nr%5]).convertSRGBToLinear()));fl.instanceColor.needsUpdate=true;
 }else{
  inst(SPH(8.5,24),M(0x6b3f1d,{roughness:.9}),H.length,(i,o)=>{const p=H[i];o.position.set(p.p.x,TOP+7,p.p.y-1);o.scale.set(1,.92,1);});
  inst(BOX(.25,6,.25),M(0x4a2a12),H.length*6,(i,o)=>{const p=H[(i/6)|0],k=i%6,a=k/6*Math.PI*2+p.nr;o.position.set(p.p.x+Math.cos(a)*7.6,TOP+8+Math.sin(k)*2,p.p.y-1+Math.sin(a)*7.6);o.rotation.set(0,-a,.3);});// Fasern
  inst(SPH(3,10),M(0x3f9b45),H.length*3,(i,o)=>{const p=H[(i/3)|0],k=i%3;o.position.set(p.p.x+(k-1)*2.6,TOP+15.2,p.p.y-1);o.scale.set(1.5,.35,.8);o.rotation.set(0,k*1.1,(k-1)*.35);});
  inst(new THREE.CylinderGeometry(2,2,.6,16,1,false,0,Math.PI),M(0x2a1608),H.length,(i,o)=>{const p=H[i];o.position.set(p.p.x,TOP+3.5,p.p.y+6.9);o.rotation.set(Math.PI/2,0,0);o.scale.set(1,1,1.6);});
  inst(CYL(1.3,1.3,.4,16),M(0xfff6e0,NACHT?{emissive:0xffb040,emissiveIntensity:1.4}:{}),H.length,(i,o)=>{const p=H[i];o.position.set(p.p.x+4,TOP+8,p.p.y+6.4);o.rotation.set(Math.PI/2.4,0,0);});
 }
 // ---------- Namensschilder vor jeder Hütte (eine Textur für alle) ----------
 {const CW=256,CH=44,cols=16,rows=Math.ceil(H.length/cols),cvs=document.createElement('canvas');cvs.width=CW*cols;cvs.height=Math.max(64,CH*rows);const x=cvs.getContext('2d');
  H.forEach((p,i)=>{const cx=(i%cols)*CW,cy=((i/cols)|0)*CH;let fs=26;x.font='800 '+fs+'px system-ui';let tw=x.measureText(p.name).width;if(tw>CW-24){fs=fs*(CW-24)/tw;x.font='800 '+fs+'px system-ui';tw=x.measureText(p.name).width;}
   x.fillStyle='rgba(255,255,255,.95)';x.beginPath();x.roundRect(cx+(CW-tw)/2-10,cy+4,tw+20,CH-8,(CH-8)/2);x.fill();x.fillStyle='#2a1b12';x.textAlign='center';x.textBaseline='middle';x.fillText(p.name,cx+CW/2,cy+CH/2+1);});
  const t=new THREE.CanvasTexture(cvs);t.encoding=THREE.sRGBEncoding;t.anisotropy=8;
  const pos=[],uv=[],idx=[],W2=14,H2=W2*CH/CW,ang=-.75;
  H.forEach((p,i)=>{const u0=(i%cols)*CW/cvs.width,u1=u0+CW/cvs.width,v1=1-((i/cols)|0)*CH/cvs.height,v0=v1-CH/cvs.height;const x0=p.p.x-W2/2,x1=p.p.x+W2/2,zc=p.p.y+(KOK?11.5:9.6),yc=TOP+1.6,dy=Math.sin(-ang)*H2/2,dz=Math.cos(-ang)*H2/2;const b=pos.length/3;
   pos.push(x0,yc-dy,zc+dz, x1,yc-dy,zc+dz, x1,yc+dy,zc-dz, x0,yc+dy,zc-dz);uv.push(u0,v0,u1,v0,u1,v1,u0,v1);idx.push(b,b+1,b+2,b,b+2,b+3);});
  const gg=new THREE.BufferGeometry();gg.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));gg.setAttribute('uv',new THREE.Float32BufferAttribute(uv,2));gg.setIndex(idx);gg.computeVertexNormals();
  const lab=new THREE.Mesh(gg,new THREE.MeshBasicMaterial({map:t,transparent:true,depthWrite:false}));lab.renderOrder=2;sc.add(lab);}

 // ---------- Natur: Palmen, Büsche, Steine, Blumen, Gras ----------
 const PALMS=(v.palms||[]).slice();
 for(let i=0;i<90;i++){const a=i/90*Math.PI*2+rnd(i,1)*.05,r=coastAt(v,a)+BEX*.4+rnd(i,2)*8,x=v.x+Math.cos(a)*r,y=v.y+Math.sin(a)*r;if(GEB.some(b=>x>b.x0-14&&x<b.x1+14&&y>b.y0-14&&y<b.y1+14))continue;if(MAINI&&YACHT&&Math.hypot(x-YACHT.cx,y-YACHT.cy)<90)continue;if(rnd(i,3)<.3)continue;PALMS.push({x,y:y-3,s:.85+rnd(i,4)*.5});}
 const BUSH=(v.bush||[]).slice();(v.free||[]).forEach((f,i)=>{if(rnd(i,7)<.6)BUSH.push({x:f.x+(rnd(i,8)-.5)*6,y:f.y,r:3.2+rnd(i,9)*2.6});});
 PALMS.forEach((t,i)=>{const s=t.s||1,x=t.x,z=t.y+3,h=17*s,lean=(rnd(i,5)-.5)*.25;const grp=new THREE.Group();grp.position.set(x,TOP-1,z);grp.rotation.z=lean;sc.add(grp);

 for(let i=0;i<36;i++){const a=rnd(i,21)*Math.PI*2,r=coastAt(v,a)+BEX*.6+4+rnd(i,22)*6,x=v.x+Math.cos(a)*r,z=v.y+Math.sin(a)*r;if(GEB.some(b=>x>b.x0-10&&x<b.x1+10&&z>b.y0-10&&z<b.y1+10))continue;if(MAINI&&YACHT&&Math.hypot(x-YACHT.cx,z-YACHT.cy)<90)continue;

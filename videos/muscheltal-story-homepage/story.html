<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:L;src:url(LilitaOne-Regular.woff2)}
*{margin:0;box-sizing:border-box}body{width:1080px;height:1920px;overflow:hidden;position:relative;font-family:Inter,system-ui,sans-serif;background:#0a5a92}
.bg{position:absolute;inset:-40px;background:url(bg.jpg) center/cover;filter:blur(10px) saturate(1.1)}
.shade{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 55%,rgba(10,30,70,.15),rgba(10,30,70,.6))}
.c{position:absolute;left:0;right:0;margin:0 auto;width:fit-content;text-align:center}
.stamp{top:230px;padding:6px 30px 12px;border:6px solid #2a1b12;border-radius:20px;background:#ffd23f;color:#2a1b12;font:400 58px L;transform:rotate(-3deg);box-shadow:0 10px 0 rgba(0,0,0,.25)}
.h{top:340px;font:400 92px/1.02 L;color:#fff;-webkit-text-stroke:14px #2a1b12;paint-order:stroke fill}
.h b{font-weight:400;color:#ffe14d}
.ph{position:absolute;left:330px;top:560px;width:420px;height:747px;border-radius:56px;background:#111;padding:12px;box-shadow:0 0 0 4px #2a1b12,0 30px 60px rgba(0,0,0,.5);transform:rotate(-4deg)}
.ph img{width:100%;height:100%;object-fit:cover;object-position:top;border-radius:46px;display:block}
.ph .blur{position:absolute;left:12px;right:12px;bottom:12px;height:46%;border-radius:0 0 46px 46px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);background:rgba(255,255,255,.18);display:grid;place-items:center;font:400 120px L;color:#fff;text-shadow:0 6px 0 rgba(0,0,0,.3)}
.chip{position:absolute;padding:12px 22px 14px;border-radius:24px;background:#fff;color:#2a1b12;font:900 34px/1.15 Inter,sans-serif;box-shadow:0 0 0 5px #2a1b12,0 10px 0 rgba(0,0,0,.28);white-space:nowrap}
.chip.lock{background:#2a1b12;color:#ffd23f}
.cta{top:1400px;padding:18px 34px 22px;border-radius:30px;background:#fe2c55;color:#fff;font:400 54px/1.05 L;box-shadow:0 0 0 6px #2a1b12,0 12px 0 rgba(0,0,0,.3);transform:rotate(-1.5deg)}
.cta small{display:block;font:800 32px Inter,sans-serif;margin-top:6px}
</style></head><body>
<div class="bg"></div><div class="shade"></div>
<div class="c stamp">👀 BALD FÜR DICH</div>
<div class="c h">Muschel-Tal wird<br><b>SPIELBAR!</b></div>
<div class="ph"><img src="hp.png" alt=""><div class="blur">🔒</div></div>
<div class="chip" style="left:60px;top:640px;transform:rotate(-3deg)">🔍 Finde deine Hütte</div>
<div class="chip" style="left:40px;top:800px;transform:rotate(2deg)">🪪 Dein eigener<br>Muschelpass</div>
<div class="chip" style="left:70px;top:1000px;transform:rotate(-2deg)">🐚 Muscheln<br>sammeln</div>
<div class="chip" style="left:60px;top:1180px;transform:rotate(3deg)">🚶 Selbst über<br>die Insel laufen</div>
<div class="chip lock" style="left:700px;top:1220px;transform:rotate(5deg)">🔒 ??? Psst …</div>
<div class="c cta">🎁 Die ersten 1.000 Bewohner<br>bekommen Vorteile im Spiel!<small>➕ Folg mir & sichere dir deinen Platz</small></div>
</body></html>

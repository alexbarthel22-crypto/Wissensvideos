<!doctype html>
<html lang="de" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0a0c1d; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden;
        background: radial-gradient(ellipse 85% 50% at 50% 52%, #2a1f5c 0%, #141838 50%, #090b1a 100%); }
      .abs { position: absolute; }
      .c { left: 0; width: 1080px; text-align: center; white-space: nowrap; font-family: "Inter", sans-serif; font-weight: 900; line-height: 1; }
      #bar { left: 60px; top: 250px; width: 960px; height: 96px; border-radius: 18px; background: #ff3b55; color: #fff; display: flex; align-items: center; padding: 0 30px;
        box-shadow: 0 0 60px rgba(255,59,85,.6); font: 900 44px Inter, sans-serif; letter-spacing: .04em; }
      #bar .dot { width: 28px; height: 28px; border-radius: 50%; background: #fff; margin-right: 20px; box-shadow: 0 0 18px #fff; }
      #bar .live { margin-left: auto; font: 700 32px "Space Mono", monospace; letter-spacing: .14em; padding: 2px 14px; border: 4px solid #fff; border-radius: 10px; }
      #h1 { top: 384px; font-size: 76px; color: #fff; text-shadow: 0 7px 0 rgba(0,0,0,.55); }
      #h2 { top: 470px; font-size: 200px; letter-spacing: -.03em; color: #ffd43b; text-shadow: 0 12px 0 #8a6a00, 0 0 70px rgba(255,212,59,.6); }
      #h3 { top: 694px; font-size: 80px; letter-spacing: -.02em; color: #ff4fb0; text-shadow: 0 9px 0 #8a1450, 0 0 60px rgba(255,79,176,.7); }
      .chip { padding: 10px 20px; border: 4px solid #ff3b55; border-radius: 12px; background: rgba(40,10,24,.9);
        color: #ffb3bf; font: 700 38px "Space Mono", monospace; letter-spacing: .04em; white-space: nowrap; }
      .chip b { color: #ff3b55; }
      #c1 { left: 50px; top: 1000px; transform: rotate(-4deg); }
      #c2 { left: 70px; top: 1110px; transform: rotate(2deg); }
      #c3 { left: 50px; top: 1220px; transform: rotate(-2deg); }
      #q { left: 60px; width: 960px; top: 1440px; height: 170px; border-radius: 26px; background: #0b0e22; border: 6px solid #ffd43b;
        box-shadow: 0 0 60px rgba(255,212,59,.45); text-align: center; color: #fff; font: 900 64px/158px Inter, sans-serif; }
      #q span { color: #ff3b55; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="cover" data-start="0" data-duration="1" data-width="1080" data-height="1920" data-no-timeline>
      <svg id="cv" class="abs" style="left:0;top:0;width:1080px;height:1920px" viewBox="0 0 1080 1920">
        <circle cx="760" cy="1130" r="280" fill="#ff4fb0" opacity=".18"/>
      </svg>
      <script>(()=>{const NS="http://www.w3.org/2000/svg",sv=document.getElementById("cv");
        const el=(n,a)=>{const e=document.createElementNS(NS,n);for(const k in a)e.setAttribute(k,a[k]);sv.appendChild(e);return e;};
        const DE = [[8.6,55.0],[9.6,54.8],[10.0,54.5],[10.9,54.3],[11.1,54.0],[11.6,54.1],[12.3,54.2],[13.1,54.5],[13.6,54.6],[14.2,53.9],[14.4,53.3],[14.1,52.8],[14.6,52.6],[14.7,52.1],[15.0,51.1],[14.8,50.9],[14.3,51.0],[13.5,50.7],[12.5,50.4],[12.1,50.3],[12.5,49.8],[12.9,49.4],[13.6,49.0],[13.8,48.6],[13.4,48.4],[12.8,48.0],[13.0,47.5],[12.4,47.7],[11.6,47.6],[10.5,47.55],[10.1,47.4],[9.6,47.55],[8.6,47.65],[7.6,47.6],[7.5,48.1],[8.1,48.9],[7.0,49.15],[6.4,49.45],[6.1,50.1],[6.0,50.8],[5.9,51.0],[6.2,51.4],[5.95,51.8],[6.7,51.9],[7.0,52.4],[7.0,53.3],[7.2,53.7],[8.1,53.6],[8.7,53.9],[8.9,54.4]];
        const cx=760,cy=1130,h=500,S=h/7.8,w=9.1*0.63*S,pr=(lo,la)=>[cx-w/2+(lo-5.9)*0.63*S,cy-h/2+(55.1-la)*S];
        const poly=DE.map(([a,b])=>pr(a,b));
        el("path",{d:"M"+poly.map(p=>p.map(v=>v.toFixed(1)).join(",")).join(" L")+"Z",fill:"#5a2346",stroke:"#ff3b55","stroke-width":8,"stroke-linejoin":"round"});
        let seed=7;const r=()=>{seed=(seed*16807)%2147483647;return seed/2147483647;};
        const inP=(x,y)=>{let c=false;for(let i=0,j=poly.length-1;i<poly.length;j=i++){const[xi,yi]=poly[i],[xj,yj]=poly[j];if((yi>y)!==(yj>y)&&x<(xj-xi)*(y-yi)/(yj-yi)+xi)c=!c;}return c;};
        const C=["#ffd43b","#4da3ff","#39e27a","#ff8a3d","#ff4fb0","#ffffff"];let n=0;
        while(n<420){const x=cx-h*0.4+r()*h*0.8,y=cy-h/2+r()*h;if(inP(x,y)){el("circle",{cx:x,cy:y,r:6,fill:C[n%6]});n++;}}
        for(let i=0;i<40;i++){const a=r()*6.28,d=330+r()*120,y=cy+Math.sin(a)*d;if(y<840||y>1420)continue;el("circle",{cx:cx+Math.cos(a)*d,cy:y,r:6,fill:C[i%6],opacity:.8});}
      })();</script>

      <div id="bar" class="abs"><span class="dot"></span>EILMELDUNG<span class="live">LIVE</span></div>
      <div id="h1" class="abs c">WAS PASSIERT, WENN</div>
      <div id="h2" class="abs c">8 MRD.</div>
      <div id="h3" class="abs c">IN DEUTSCHLAND LEBEN?</div>

      <div id="c1" class="abs chip">BERLIN: 370 MIO<b>!</b></div>
      <div id="c2" class="abs chip">44 M² PRO KOPF<b>!</b></div>
      <div id="c3" class="abs chip">HUNGERSNOT<b>!</b></div>

      <div id="q" class="abs">UND DER <span>REST</span> DER WELT?</div>
    </div>
  </body>
</html>

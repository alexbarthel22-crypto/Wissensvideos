<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:L;src:url(LilitaOne-Regular.woff2)}
*{margin:0;box-sizing:border-box}body{width:1080px;height:1920px;overflow:hidden;position:relative;font-family:Inter,system-ui,sans-serif;background:#2a1b3a}
.bg{position:absolute;inset:0;background:url(bg.png) center/cover}
.sun{position:absolute;inset:0;background:linear-gradient(180deg,rgba(70,30,110,.75) 0%,rgba(200,70,110,.45) 24%,rgba(255,130,70,.32) 48%,rgba(255,160,80,.22) 70%,rgba(120,40,90,.55) 100%);mix-blend-mode:multiply}
.glow{position:absolute;left:560px;top:-260px;width:900px;height:900px;border-radius:50%;background:radial-gradient(circle,rgba(255,235,160,.95) 0%,rgba(255,170,80,.55) 22%,rgba(255,120,60,0) 60%);mix-blend-mode:screen}
.fire{position:absolute;left:290px;top:760px;width:500px;height:500px;border-radius:50%;background:radial-gradient(circle,rgba(255,190,90,.6) 0%,rgba(255,130,50,0) 65%);mix-blend-mode:screen}
.c{position:absolute;left:0;right:0;margin:0 auto;width:fit-content;text-align:center}
.stamp{top:250px;padding:6px 30px 12px;border:6px solid #3b2a7a;border-radius:20px;background:#fff;color:#3b2a7a;font:400 56px L;transform:rotate(-4deg);box-shadow:0 10px 0 rgba(0,0,0,.25)}
.h{top:370px;font:400 122px/1.0 L;color:#fff;-webkit-text-stroke:16px #2a1b3a;paint-order:stroke fill}
.h b{font-weight:400;color:#ffe14d}
.card{top:1320px;width:930px;padding:26px 34px 30px;border-radius:36px;background:rgba(255,255,255,.96);color:#2a1b3a;font:900 50px/1.22 Inter,sans-serif;box-shadow:0 0 0 6px #2a1b3a,0 12px 0 rgba(0,0,0,.3)}
.card em{font-style:normal;color:#e2560c}.card i{font-style:normal;color:#2e9e5b}
.cta{top:1600px;padding:12px 40px 18px;border-radius:999px;background:#fe2c55;color:#fff;font:400 60px L;box-shadow:0 0 0 6px #2a1b3a,0 12px 0 rgba(0,0,0,.3);transform:rotate(-2deg)}
</style></head><body>
<div class="bg"></div><div class="sun"></div><div class="fire"></div><div class="glow"></div>
<div class="c stamp">🌙 HEUTE NACHT</div>
<div class="c h">Wer soll noch<br><b>EINZIEHEN?</b></div>
<div class="c card">Folgt bis <em>23:30 Uhr</em> –<br>und habt <i>morgen</i> eure Hütte<br>auf 🥥 Kokos-Küste!</div>
<div class="c cta">➕ @muscheltal folgen</div>
</body></html>

<!doctype html>
<html lang="de" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0a0c1d; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden;
        background: radial-gradient(ellipse 85% 50% at 50% 46%, #2a1f5c 0%, #141838 50%, #090b1a 100%); }
      .abs { position: absolute; }

      /* Hintergrund: riesiger pinker Globus = "die halbe Welt spielt" */
      #globe { left: 40px; top: 560px; width: 1000px; height: 1000px; }

      /* Eilmeldungs-Leiste oben (sichtbar auch im 3:4-Ausschnitt des Profilrasters) */
      #bar { left: 60px; top: 250px; width: 960px; height: 104px; border-radius: 18px; background: #ff3b55;
        display: flex; align-items: center; padding: 0 34px; color: #fff; box-shadow: 0 0 60px rgba(255,59,85,.55);
        font-family: "Inter", sans-serif; font-weight: 900; font-size: 56px; letter-spacing: .06em; }
      #bar .dot { width: 30px; height: 30px; border-radius: 50%; background: #fff; margin-right: 22px; box-shadow: 0 0 18px #fff; }
      #bar .live { margin-left: auto; font-family: "Space Mono", monospace; font-weight: 700; font-size: 34px;
        letter-spacing: .14em; padding: 2px 16px; border: 4px solid #fff; border-radius: 10px; }

      /* Schlagzeile */
      #h1 { left: 0; width: 1080px; top: 392px; text-align: center; font-family: "Inter", sans-serif; font-weight: 900; white-space: nowrap;
        font-size: 108px; line-height: 1; letter-spacing: -.03em; color: #ffd43b;
        text-shadow: 0 8px 0 rgba(0,0,0,.55), 0 0 40px rgba(255,212,59,.35); }
      #h2 { left: 0; width: 1080px; top: 508px; white-space: nowrap; text-align: center; font-family: "Inter", sans-serif; font-weight: 900;
        font-size: 92px; line-height: 1; letter-spacing: -.01em; color: #fff; text-shadow: 0 7px 0 rgba(0,0,0,.55); }
      #gta { left: 0; width: 1080px; top: 606px; white-space: nowrap; text-align: center; font-family: "Inter", sans-serif; font-weight: 900;
        font-size: 330px; line-height: 1; letter-spacing: -.04em; color: #ff4fb0;
        text-shadow: 0 12px 0 #8a1450, 0 0 70px rgba(255,79,176,.75); }
      #h3 { left: 0; width: 1080px; top: 960px; white-space: nowrap; text-align: center; font-family: "Inter", sans-serif; font-weight: 900;
        font-size: 96px; line-height: 1; color: #fff; letter-spacing: -.01em; text-shadow: 0 7px 0 rgba(0,0,0,.55); }

      /* Kalenderblatt, schräg */
      #cal { left: 760px; top: 1120px; width: 240px; height: 262px; border-radius: 20px; background: #f3f1ea; overflow: hidden;
        transform: rotate(8deg); box-shadow: 0 24px 60px rgba(0,0,0,.6); }
      #cal .hd { height: 70px; background: #ff3b55; color: #fff; text-align: center; line-height: 70px;
        font-family: "Inter", sans-serif; font-weight: 900; font-size: 34px; letter-spacing: .06em; }
      #cal .d { text-align: center; font-family: "Inter", sans-serif; font-weight: 900; font-size: 150px; line-height: 186px; color: #161a36; }

      /* Was kaputtgeht: Teaser-Chips */
      .chip { padding: 10px 22px; border: 4px solid #ff3b55; border-radius: 12px; background: rgba(40,10,24,.85);
        color: #ff8a9a; font-family: "Space Mono", monospace; font-weight: 700; font-size: 40px; letter-spacing: .06em; }
      .chip b { color: #ff3b55; margin-left: 10px; }
      #c1 { left: 80px; top: 1150px; transform: rotate(-4deg); }
      #c2 { left: 120px; top: 1250px; transform: rotate(2deg); }
      #c3 { left: 70px; top: 1350px; transform: rotate(-2deg); }

      /* Frage unten */
      #q { left: 60px; width: 960px; top: 1470px; height: 150px; border-radius: 24px; background: #0b0e22;
        border: 5px solid #ffd43b; box-shadow: 0 0 50px rgba(255,212,59,.4); text-align: center; color: #fff;
        font-family: "Inter", sans-serif; font-weight: 900; font-size: 70px; line-height: 140px; }
      #q span { color: #ffd43b; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="cover" data-start="0" data-duration="1" data-width="1080" data-height="1920" data-no-timeline>
      <svg id="globe" class="abs" viewBox="0 0 700 700">
        <defs>
          <radialGradient id="g" cx="42%" cy="36%" r="70%">
            <stop offset="0" stop-color="#5068dc" /><stop offset=".6" stop-color="#2b3b9c" /><stop offset="1" stop-color="#151c55" />
          </radialGradient>
          <clipPath id="cl"><circle cx="350" cy="350" r="318" /></clipPath>
        </defs>
        <circle cx="350" cy="350" r="350" fill="#ff4fb0" opacity=".28" />
        <circle cx="350" cy="350" r="318" fill="url(#g)" />
        <g clip-path="url(#cl)" fill="#5f78e6" opacity=".5">
          <path d="M120 170 C170 120 260 120 300 160 C330 190 300 240 260 250 C230 258 230 300 200 320 C160 340 110 300 100 250 C92 215 100 190 120 170Z" />
          <path d="M230 360 C270 350 300 380 300 430 C300 480 270 540 240 560 C215 575 205 530 210 490 C214 450 200 400 230 360Z" />
          <path d="M360 150 C410 130 470 140 520 170 C570 200 600 250 580 290 C560 330 500 320 470 300 C450 330 420 340 400 320 C380 300 390 270 370 250 C345 225 330 175 360 150Z" />
          <path d="M400 340 C440 330 470 360 470 410 C470 460 440 500 410 500 C385 500 375 460 380 420 C383 390 375 350 400 340Z" />
          <path d="M520 440 C560 430 600 450 600 480 C600 510 560 520 530 510 C505 502 498 450 520 440Z" />
        </g>
        <g id="dots" clip-path="url(#cl)"></g>
      </svg>

      <div id="bar" class="abs"><span class="dot"></span>EILMELDUNG<span class="live">LIVE</span></div>
      <div id="h1" class="abs">4,1 MILLIARDEN</div>
      <div id="h2" class="abs">MENSCHEN ZOCKEN</div>
      <div id="gta" class="abs">GTA 6</div>
      <div id="h3" class="abs">GLEICHZEITIG!</div>

      <div id="c1" class="abs chip">SERVER<b>✕</b></div>
      <div id="c2" class="abs chip">STROMNETZ<b>✕</b></div>
      <div id="c3" class="abs chip">WIRTSCHAFT<b>✕</b></div>
      <div id="cal" class="abs"><div class="hd">NOV</div><div class="d">19</div></div>

      <div id="q" class="abs">WAS PASSIERT <span>DANN?</span></div>
    </div>
    <script>
      // Pinke Spieler-Punkte auf den Kontinenten (fester Seed, statisches Bild)
      (() => {
        let seed = 1911;
        const rnd = () => { seed = (seed * 16807) % 2147483647; return seed / 2147483647; };
        const zones = [[200, 220, 110, 80], [255, 460, 45, 90], [470, 230, 110, 70], [425, 420, 45, 70], [560, 478, 40, 20]];
        const g = document.getElementById("dots"), ns = "http://www.w3.org/2000/svg";
        for (let i = 0; i < 220; i++) {
          const z = zones[i % zones.length], a = rnd() * Math.PI * 2, d = Math.sqrt(rnd());
          const c = document.createElementNS(ns, "circle");
          c.setAttribute("cx", (z[0] + Math.cos(a) * z[2] * d).toFixed(1));
          c.setAttribute("cy", (z[1] + Math.sin(a) * z[3] * d).toFixed(1));
          c.setAttribute("r", (3 + rnd() * 4).toFixed(1));
          c.setAttribute("fill", "#ff4fb0");
          g.appendChild(c);
        }
      })();
    </script>
  </body>
</html>

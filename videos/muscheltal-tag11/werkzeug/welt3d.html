{const n=lblPos.length;const g=new THREE.InstancedBufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(new Float32Array([-1,-1,0,1,-1,0,1,1,0,-1,1,0]),3));g.setAttribute('uv',new THREE.BufferAttribute(new Float32Array([0,0,1,0,1,1,0,1]),2));g.setIndex([0,1,2,0,2,3]);
 const off=new Float32Array(n*3),uvo=new Float32Array(n*2);lblPos.forEach((p,i)=>{off.set([p[0],p[1],p[2]],i*3);uvo.set([p[3]/4096,1-(p[4]+LH)/4096],i*2);});
 g.setAttribute('off',new THREE.InstancedBufferAttribute(off,3));g.setAttribute('uvo',new THREE.InstancedBufferAttribute(uvo,2));g.instanceCount=n;
 const lm=new THREE.ShaderMaterial({transparent:true,depthWrite:false,uniforms:{map:{value:ATEX},fade:{value:0}},
 vertexShader:`attribute vec3 off;attribute vec2 uvo;varying vec2 vUv;varying float vA;uniform float fade;void main(){vec4 mv=modelViewMatrix*vec4(off,1.);float d=-mv.z;vA=clamp(1.-(d-34.)/16.,0.,1.)*smoothstep(10.,18.,d)*fade;mv.xy+=position.xy*vec2(2.3,.5);vUv=uvo+uv*vec2(${LW}./4096.,${LH}./4096.);gl_Position=projectionMatrix*mv;}`,
 fragmentShader:`uniform sampler2D map;varying vec2 vUv;varying float vA;void main(){vec4 c=texture2D(map,vUv);c.a*=vA;if(c.a<.02)discard;gl_FragColor=c;}`});
 const L=new THREE.Mesh(g,lm);L.frustumCulled=false;L.renderOrder=10;S.add(L);window.LBL=lm;}
// Palace: große Muschel aus der Logo-Form
{const g=new THREE.Group();const pm=new THREE.MeshStandardMaterial({color:0xffb3c8,roughness:.45,metalness:.05}),wm2=new THREE.MeshStandardMaterial({color:0xfff2e6,roughness:.6}),rm=new THREE.MeshStandardMaterial({color:0xe8467c,roughness:.5}),gold=new THREE.MeshStandardMaterial({color:0xf2c14e,metalness:.6,roughness:.3});
 const P=[[32,47],[8.8,40.8],[5,34],[12.7,32.7],[11.6,25],[19.2,26.7],[21,19.1],[27.5,23.4],[32,17],[36.5,23.4],[43,19.1],[44.8,26.7],[52.4,25],[51.3,32.7],[59,34],[55.2,40.8]];
 const sh=new THREE.Shape();P.forEach(([x,y],i)=>{const X=(x-32)*.55,Y=(47-y)*.55;i?sh.lineTo(X,Y):sh.moveTo(X,Y);});sh.closePath();
 const shell=new THREE.Mesh(new THREE.ExtrudeGeometry(sh,{depth:2.4,bevelEnabled:true,bevelSize:.8,bevelThickness:.8,bevelSegments:4}),pm);shell.position.set(0,2.6,-3);shell.castShadow=true;g.add(shell);

 for(const sx of [-8.5,8.5]){const t=new THREE.Mesh(new THREE.CylinderGeometry(1.5,1.7,7,16),wm2);t.position.set(sx,6.4,1);t.castShadow=true;g.add(t);const c=new THREE.Mesh(new THREE.ConeGeometry(2,3.2,16),pm);c.position.set(sx,11.5,1);g.add(c);const f=new THREE.Mesh(new THREE.SphereGeometry(.4,8,6),gold);f.position.set(sx,13.3,1);g.add(f);}
 g.position.set(2,0,2);S.add(g);}

 for(let i=0;i<6;i++){const seg=new THREE.Mesh(new THREE.CylinderGeometry(.35,.45,1.3,7),tm);seg.position.set(i*.18,1+i*1.2,0);seg.rotation.z=-.08*i;seg.castShadow=true;g.add(seg);}

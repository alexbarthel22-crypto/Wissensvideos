<script>
// Muschel-Tal LIVE – Bühne 1080×1920 (TikTok-Hochformat).
// Oben (y 150–520) feste Infos, darunter die große Insel. Bei Ausbauten fährt die Kamera an das Haus heran.
const C = document.getElementById('c'), X = C.getContext('2d');
const W = 1080, H = 1920;
const FONT = '"SF Pro Rounded",ui-rounded,"Arial Rounded MT Bold","Nunito","Varela Round",system-ui,sans-serif';
const INK = '#2a1b12', GELB = '#ffd23f', PINK = '#e8467c', TUERKIS = '#2fb3a0';
const LOGO = new Image(); LOGO.src = 'logo.svg';

let S = { spieler: [], stufen: ['Zelt'], stufenAb: [0], projekt: null, fertig: [], abstimmung: null, kasse: 0, bewohner: 0, ziel: null, strassen: [] };
const fx = [], banner = [], pop = {};
let untertitel = { text: '', t: 0 };

// ================= Insel-Geometrie (wächst mit) =================
// Maß m(x,y): 1 = Grundform. Die Insel hat Größe K: alles mit m <= K ist Insel. K wächst, wenn alle Grundstücke voll sind.
const IX = 540, IY = 1205, RX = 520, RY = 690;
const rand = a => 1 + .035 * Math.sin(a * 3 + 1) + .03 * Math.sin(a * 5 + 2) + .018 * Math.sin(a * 11 + .5);
const mass = (x, y) => { const dx = (x - IX) / RX, dy = (y - IY) / RY; return Math.hypot(dx, dy) / rand(Math.atan2(dy, dx)); };
const innen = (x, y, s) => mass(x, y) <= s;
const PLATZ_R = 168;
const PX = 250, PY = 176, STR = 30;
const GI = 9, GJ = 13;                                          // Raster reicht für sehr große Inseln
const XS = [], YS = [];

for (let k = -GJ; k <= GJ; k++) YS.push(IY + k * PY);
const RAND_GRAS = .95, RAND_PLATZ = .935;
let K = 1;                                                      // aktuelle Inselgröße
const START_PLAETZE = 200, K_MAX = 2.6;

function zufall(seed) { return () => (seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296; }

// Alle möglichen Grundstücke (3 × 2 je Block), sortiert nach Abstand zur Muschel.
// Ein Grundstück gehört zur Insel, sobald K >= sein Maß – so bleiben alte Grundstücke beim Wachsen an ihrem Platz.
const ALLE = (() => {
  const out = [];
  for (let i = 0; i < XS.length - 1; i++) for (let j = 0; j < YS.length - 1; j++) {
    const bx = XS[i] + STR / 2 + 3, by = YS[j] + STR / 2 + 3, bw = PX - STR - 6, bh = PY - STR - 6;
    for (let q = 0; q < 3; q++) for (let r = 0; r < 2; r++) {

})();

let ANZAHL = 0;
function kFuer(spieler) {
  let k = .9; while (k < K_MAX && plaetzeBei(k) < Math.max(START_PLAETZE, spieler + 12)) k += .02;
  return Math.round(k * 100) / 100;
}

// Straßen: jede Rasterlinie bekommt feste Namen (getrennt nördl./südl. bzw. westl./östl. des Platzes)
function strassenBei(k, namen) {
  const seg = [];
  const linien = [];
  XS.forEach((x, i) => linien.push({ senkrecht: true, fest: x, idx: i - GI }));
  YS.forEach((y, j) => linien.push({ senkrecht: false, fest: y, idx: j - GJ }));
  linien.sort((a, b) => Math.abs(a.idx) - Math.abs(b.idx) || (a.senkrecht ? -1 : 1) || a.idx - b.idx);
  let nr = 0;
  linien.forEach(L => {
    const lang = L.senkrecht ? RY : RX, von = (L.senkrecht ? IY : IX) - lang * K_MAX * 1.1, bis = -von + 2 * (L.senkrecht ? IY : IX);
    const teile = L.idx === 0 ? 2 : 1, name = [namen[nr % namen.length], namen[(nr + 1) % namen.length]]; nr += teile;
    let start = null; const step = 6;
    for (let v = von; v <= bis + step; v += step) {
      const x = L.senkrecht ? L.fest : v, y = L.senkrecht ? v : L.fest;
      const auf = v <= bis && innen(x, y, k * RAND_GRAS) && Math.hypot(x - IX, y - IY) > PLATZ_R + 4;
      if (auf && start === null) start = v;
      if (!auf && start !== null) {
        if (v - start > 100) seg.push({ ...L, von: start, bis: v - step, name: teile === 2 && v > (L.senkrecht ? IY : IX) ? name[1] : name[0] });
        start = null;
      }
    }
  });
  return seg;
}

// ================= Statische Insel vorzeichnen =================
let BASIS = null, BASIS_K = 0, BASIS_BOX = null, SEG = [], ALT = null;

  b.fillStyle = '#f3dfa6'; form(k * 1.035); b.fill();

  SEG = strassenBei(k, S.strassen.length ? S.strassen : ['Sonnenallee']);
  const weg = (w, col) => { b.strokeStyle = col; b.lineWidth = w; b.lineCap = 'round'; SEG.forEach(s => { b.beginPath(); if (s.senkrecht) { b.moveTo(s.fest, s.von); b.lineTo(s.fest, s.bis); } else { b.moveTo(s.von, s.fest); b.lineTo(s.bis, s.fest); } b.stroke(); }); };
  weg(STR + 6, '#d9b46a'); weg(STR, '#f0dca0');
  SEG.forEach(s => { for (let v = s.von; v < s.bis; v += 4) { const o = (R() - .5) * STR * .8; b.fillStyle = R() < .15 ? 'rgba(255,255,255,.8)' : 'rgba(160,120,60,.22)'; s.senkrecht ? b.fillRect(s.fest + o, v, 1.5, 1.5) : b.fillRect(v, s.fest + o, 1.5, 1.5); } });
  // Laternen + Blumen an den Kreuzungen
  XS.forEach(x => YS.forEach(y => {
    if (!innen(x, y, k * .9) || Math.hypot(x - IX, y - IY) < PLATZ_R + 30) return;
    blumenTopf(b, x - STR / 2 - 6, y - STR / 2 - 6); laterne(b, x + STR / 2 + 5, y - STR / 2 - 3);
  }));
  // Straßenschilder (feste Stellen je Block, damit sie beim Wachsen nicht springen)
  b.textAlign = 'center'; b.textBaseline = 'middle';
  SEG.forEach(s => {
    const raster = s.senkrecht ? YS : XS, d = s.senkrecht ? PY : PX;
    raster.forEach((r0, idx) => {
      if (s.senkrecht ? (idx % 3 !== 1) : (idx % 2 !== 0)) return;
      const v = r0 + d / 2; if (v < s.von + 50 || v > s.bis - 50) return;
      b.save(); s.senkrecht ? (b.translate(s.fest, v), b.rotate(-Math.PI / 2)) : b.translate(v, s.fest);
      b.font = `900 15px ${FONT}`; const tw = b.measureText(s.name).width + 22;
      b.fillStyle = '#2f6fb3'; b.beginPath(); b.roundRect(-tw / 2, -11, tw, 22, 5); b.fill();
      b.strokeStyle = '#fff'; b.lineWidth = 1.6; b.beginPath(); b.roundRect(-tw / 2 + 2.5, -8.5, tw - 5, 17, 3.5); b.stroke();
      b.textBaseline = 'alphabetic'; const m = b.measureText('Hgä'); b.fillStyle = '#fff'; b.fillText(s.name, 0, (m.actualBoundingBoxAscent - m.actualBoundingBoxDescent) / 2); b.textBaseline = 'middle'; b.restore();
    });
  });
  b.restore();
  // Strand: Palmen, Schirme, Handtücher, Liegen, Sandburgen, Seesterne, Muscheln, Volleyball, Rettungsturm
  const umfang = Math.round(34 * k);
  for (let i = 0; i < umfang; i++) {
    const a = i / umfang * 6.283 + .07, [x, y] = amRand(a, k * .985);
    if (Math.abs(a - Math.PI / 2) > .12) palme(b, x, y, .72, i * 300);
  }
  for (let i = 0; i < 20 * k; i++) {
    const a = R() * 6.283; if (Math.abs(a - Math.PI / 2) < .12) continue;
    const [x, y] = amRand(a, k * (1.005 + R() * .02)), w = R();
    if (w < .25) schirm(b, x, y, ['#e8433c', '#3fa0e8', '#ffb02e', '#ff6fa3'][i % 4]);
    else if (w < .45) handtuch(b, x, y, a, ['#ff6fa3', '#3fa0e8', '#ffd23f', '#2fb3a0'][i % 4]);
    else if (w < .6) liege(b, x, y);
    else if (w < .72) sandburg(b, x, y);
    else if (w < .86) seestern(b, x, y, R() * 6);
    else muschelChen(b, x, y);
  }
  { const [x, y] = amRand(-.35, k * 1.01); volleyball(b, x, y); }
  { const [x, y] = amRand(2.6, k * 1.008); rettungsturm(b, x, y); }
  // Steinchen im Flachwasser
  for (let i = 0; i < 12 * k; i++) { const a = R() * 6.283, [x, y] = amRand(a, k * (1.06 + R() * .03)); b.fillStyle = '#9aa6a0'; b.beginPath(); b.ellipse(x, y, 6 + R() * 6, 4 + R() * 3, 0, 0, 7); b.fill(); b.fillStyle = 'rgba(255,255,255,.3)'; b.beginPath(); b.ellipse(x - 2, y - 2, 3, 1.5, 0, 0, 7); b.fill(); }
  // Steg im Süden mit Booten
  const [sx, sy] = amRand(Math.PI / 2, k * .99);
  b.fillStyle = 'rgba(0,0,0,.15)'; b.fillRect(sx - 15, sy + 6, 36, 200);
  b.fillStyle = '#b07a45'; b.fillRect(sx - 18, sy, 36, 200); b.strokeStyle = '#8a5a2b'; b.lineWidth = 1.2; for (let v = sy; v < sy + 200; v += 7) { b.beginPath(); b.moveTo(sx - 18, v); b.lineTo(sx + 18, v); b.stroke(); }
  b.fillStyle = '#6b4423'; for (let v = sy + 20; v < sy + 200; v += 40) { b.beginPath(); b.arc(sx - 18, v, 3.5, 0, 7); b.arc(sx + 18, v, 3.5, 0, 7); b.fill(); }
  laterne(b, sx - 20, sy + 70); laterne(b, sx + 22, sy + 150); laterne(b, sx - 20, sy + 196);
  boot(b, sx + 42, sy + 110, '#e8433c'); boot(b, sx - 42, sy + 160, '#3fa0e8');
  BASIS = cv; BASIS_K = k; BASIS_BOX = B;
}
function park(b, p, i) {
  const x = p.cx, y = p.cy, R = zufall(i * 31 + 5), art = i % 6;
  b.fillStyle = 'rgba(90,170,70,.5)'; b.beginPath(); b.roundRect(p.x0 + 4, p.y0 + 4, p.w - 8, p.h - 8, 10); b.fill();
  if (art === 0) { baum(b, x - 14, y + 4, 1); baum(b, x + 12, y - 6, .8); baum(b, x + 4, y + 16, .7); }
  else if (art === 1) { bank(b, x - 10, y + 8); laterne(b, x + 18, y + 8); busch(b, x + 2, y - 14); }
  else if (art === 2) { b.fillStyle = '#6b4423'; b.beginPath(); b.ellipse(x, y, 24, 14, 0, 0, 7); b.fill(); for (let k = 0; k < 18; k++) { b.fillStyle = ['#ff6fa3', '#ffd23f', '#fff', '#e8433c', '#b58ad0'][k % 5]; b.beginPath(); b.arc(x + Math.cos(k * 2.4) * (k % 3 * 7 + 4), y + Math.sin(k * 2.4) * (k % 3 * 4 + 2), 2.6, 0, 7); b.fill(); } }
  else if (art === 3) { b.fillStyle = '#f3dfa6'; b.beginPath(); b.roundRect(x - 20, y - 12, 40, 26, 4); b.fill(); b.strokeStyle = '#b07a45'; b.lineWidth = 3; b.stroke(); b.fillStyle = '#e8433c'; b.fillRect(x - 8, y - 2, 7, 7); b.fillStyle = '#3fa0e8'; b.beginPath(); b.arc(x + 8, y + 4, 4, 0, 7); b.fill(); }
  else if (art === 4) { b.fillStyle = '#5fc7e8'; b.beginPath(); b.ellipse(x, y, 26, 15, 0, 0, 7); b.fill(); b.strokeStyle = '#d9c7a0'; b.lineWidth = 3; b.stroke(); b.fillStyle = '#57b85a'; b.beginPath(); b.arc(x - 8, y, 4, 0, 7); b.arc(x + 9, y + 4, 3, 0, 7); b.fill(); b.fillStyle = '#ff8fb8'; b.beginPath(); b.arc(x - 8, y - 1, 1.6, 0, 7); b.fill(); }
  else { palme(b, x - 16, y + 10, .45, i); palme(b, x + 16, y + 10, .45, i + 9); b.strokeStyle = '#ffb02e'; b.lineWidth = 3; b.beginPath(); b.moveTo(x - 14, y - 12); b.quadraticCurveTo(x, y - 2, x + 14, y - 12); b.stroke(); }
}
function baum(c, x, y, s) { c.fillStyle = 'rgba(0,0,0,.15)'; c.beginPath(); c.ellipse(x + 4, y + 3, 14 * s, 6 * s, 0, 0, 7); c.fill(); c.fillStyle = '#8a5a2b'; c.fillRect(x - 2 * s, y - 8 * s, 4 * s, 10 * s); c.fillStyle = '#3f9b45'; c.beginPath(); c.arc(x, y - 14 * s, 12 * s, 0, 7); c.fill(); c.fillStyle = '#57b85a'; c.beginPath(); c.arc(x - 3 * s, y - 17 * s, 7 * s, 0, 7); c.fill(); }
function busch(c, x, y) { c.fillStyle = '#3f9b45'; c.beginPath(); c.arc(x - 6, y, 7, 0, 7); c.arc(x + 6, y, 7, 0, 7); c.arc(x, y - 5, 8, 0, 7); c.fill(); c.fillStyle = '#ff6fa3'; c.beginPath(); c.arc(x - 4, y - 4, 1.8, 0, 7); c.arc(x + 5, y - 1, 1.8, 0, 7); c.fill(); }
function bank(c, x, y) { c.fillStyle = '#8a5a2b'; c.fillRect(x - 12, y - 8, 24, 3); c.fillRect(x - 12, y - 3, 24, 4); c.fillStyle = INK; c.fillRect(x - 10, y + 1, 2, 4); c.fillRect(x + 8, y + 1, 2, 4); }
function laterne(c, x, y) { LICHTER.push({ x, y: y - 23 }); c.fillStyle = INK; c.fillRect(x - 1, y - 22, 2.5, 24); c.fillStyle = '#ffe9a8'; c.beginPath(); c.arc(x, y - 23, 4, 0, 7); c.fill(); c.strokeStyle = INK; c.lineWidth = 1; c.stroke(); }
function blumenTopf(c, x, y) { c.fillStyle = '#c96a3a'; c.beginPath(); c.roundRect(x - 5, y - 2, 10, 7, 2); c.fill(); c.fillStyle = '#3f9b45'; c.beginPath(); c.arc(x, y - 4, 5, 0, 7); c.fill(); c.fillStyle = '#ff6fa3'; c.beginPath(); c.arc(x - 2, y - 5, 1.6, 0, 7); c.arc(x + 2, y - 3, 1.6, 0, 7); c.fill(); }
function handtuch(c, x, y, a, col) { c.save(); c.translate(x, y); c.rotate(a + Math.PI / 2); c.fillStyle = col; c.fillRect(-7, -12, 14, 24); c.fillStyle = 'rgba(255,255,255,.7)'; c.fillRect(-7, -6, 14, 3); c.fillRect(-7, 3, 14, 3); c.restore(); }

  c.fillStyle = 'rgba(0,0,0,.12)'; c.beginPath(); c.ellipse(x + 6, y + 8, 16, 6, 0, 0, 7); c.fill();

function palme(c, x, y, s, t) {

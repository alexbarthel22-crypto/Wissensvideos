<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Muschel-Tal LIVE</title>
<style>
  html,body{margin:0;height:100%;background:#1f8f86;overflow:hidden}
  body{display:flex;align-items:center;justify-content:center}
  canvas{height:100vh;width:auto;max-width:100vw;object-fit:contain;display:block}
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
// Muschel-Tal LIVE – Bühne 1080×1920 (TikTok-Hochformat).
// Oben (y 150–520) feste Infos, darunter die große Insel. Bei Ausbauten fährt die Kamera an das Haus heran.
const C = document.getElementById('c'), X = C.getContext('2d');
const W = 1080, H = 1920;
const FONT = '"SF Pro Rounded",ui-rounded,"Arial Rounded MT Bold","Nunito","Varela Round",system-ui,sans-serif';
const INK = '#2a1b12', GELB = '#ffd23f', PINK = '#e8467c', TUERKIS = '#2fb3a0';
const LOGO = new Image(); LOGO.src = 'logo.svg';

let S = { spieler: [], stufen: ['Zelt'], stufenAb: [0], projekt: null, fertig: [], abstimmung: null, kasse: 0, bewohner: 0, ziel: null, strassen: [] };
const fx = [], banner = [], pop = {};
let untertitel = { text: '', t: 0 };

// ================= Insel-Geometrie =================
const IX = 540, IY = 1205, RX = 520, RY = 690;               // große Insel unter der Kopfzeile
const rand = a => 1 + .035 * Math.sin(a * 3 + 1) + .03 * Math.sin(a * 5 + 2) + .018 * Math.sin(a * 11 + .5);
function innen(x, y, s) { const dx = (x - IX) / RX, dy = (y - IY) / RY, a = Math.atan2(dy, dx); return Math.hypot(dx, dy) <= rand(a) * s; }
const PLATZ_R = 168;                                           // Muschelplatz in der Mitte
const PX = 250, PY = 176, STR = 30, PL = 72;                  // Raster: Straßenabstand, Straßenbreite, Grundstück
const XS = [], YS = [];
for (let k = -3; k <= 3; k++) XS.push(IX + k * PX);
for (let k = -5; k <= 5; k++) YS.push(IY + k * PY);

// Grundstücke: 3 × 2 je Block, nur ganz auf der Wiese und außerhalb des Platzes; früher = näher an der Muschel
const PLAETZE = (() => {
  const out = [];
  for (let i = 0; i < XS.length - 1; i++) for (let j = 0; j < YS.length - 1; j++) {
    const bx = XS[i] + STR / 2 + 3, by = YS[j] + STR / 2 + 3, bw = PX - STR - 6, bh = PY - STR - 6;
    for (let q = 0; q < 3; q++) for (let r = 0; r < 2; r++) {
      const x0 = bx + q * bw / 3, y0 = by + r * bh / 2, w = bw / 3, h = bh / 2;
      const ok = [[x0, y0], [x0 + w, y0], [x0, y0 + h], [x0 + w, y0 + h]].every(([x, y]) => innen(x, y, .935));
      const cx = x0 + w / 2, cy = y0 + h / 2;
      if (ok && Math.hypot(cx - IX, cy - IY) > PLATZ_R + 30) out.push({ x: cx, y: cy + h * .28, x0, y0, w, h, d: Math.hypot(cx - IX, (cy - IY) * .8) });
    }
  }
  return out.sort((a, b) => a.d - b.d);
})();

// Straßen: jede Linie (nördl./südl. bzw. westl./östl. vom Platz getrennt) bekommt einen eigenen Namen
function strassen(namen) {
  const seg = [];
  const teile = (fest, von, bis, senkrecht) => {
    // Abschnitte auf der Wiese finden und am Platz trennen
    let start = null; const step = 6;
    for (let v = von; v <= bis + step; v += step) {
      const x = senkrecht ? fest : v, y = senkrecht ? v : fest;
      const auf = v <= bis && innen(x, y, .93) && Math.hypot(x - IX, y - IY) > PLATZ_R + 4;
      if (auf && start === null) start = v;
      if (!auf && start !== null) { if (v - start > 120) seg.push({ senkrecht, fest, von: start, bis: v - step }); start = null; }
    }
  };
  XS.forEach(x => teile(x, IY - RY, IY + RY, true));
  YS.forEach(y => teile(y, IX - RX, IX + RX, false));
  seg.forEach((s, i) => s.name = namen[i % namen.length] || '');
  return seg;
}

// ================= Statische Insel vorzeichnen (scharf auch beim Heranzoomen) =================
const Q = 2.4, OX = -40, OY = 470, OW = 1160, OH = 1470;
let BASIS = null, BASIS_NAMEN = '';
function basisZeichnen() {
  const cv = document.createElement('canvas'); cv.width = OW * Q; cv.height = OH * Q;
  const b = cv.getContext('2d'); b.setTransform(Q, 0, 0, Q, -OX * Q, -OY * Q);
  const form = s => { b.beginPath(); for (let i = 0; i <= 180; i++) { const a = i / 180 * 6.2832, k = rand(a) * s; const x = IX + Math.cos(a) * RX * k, y = IY + Math.sin(a) * RY * k; i ? b.lineTo(x, y) : b.moveTo(x, y); } b.closePath(); };
  b.fillStyle = 'rgba(127,224,200,.55)'; form(1.1); b.fill();
  b.fillStyle = 'rgba(255,255,255,.35)'; b.lineWidth = 3; b.strokeStyle = 'rgba(255,255,255,.5)'; form(1.06); b.stroke();
  b.fillStyle = '#f3dfa6'; form(1.035); b.fill();
  b.fillStyle = '#e9cf8c'; for (let i = 0; i < 900; i++) { const a = Math.random() * 6.283, r = 1 + Math.random() * .03; b.fillRect(IX + Math.cos(a) * RX * rand(a) * r, IY + Math.sin(a) * RY * rand(a) * r, 1.5, 1.5); }
  b.fillStyle = '#7cc85a'; form(.95); b.fill();
  b.save(); form(.95); b.clip();
  for (let i = 0; i < 2600; i++) { b.fillStyle = Math.random() < .5 ? 'rgba(255,255,255,.07)' : 'rgba(40,110,30,.08)'; b.beginPath(); b.arc(IX - RX + Math.random() * RX * 2, IY - RY + Math.random() * RY * 2, 2 + Math.random() * 5, 0, 7); b.fill(); }
  // Grundstücke: leicht hellere Rasenflächen mit Kante
  PLAETZE.forEach(p => { b.fillStyle = 'rgba(255,255,255,.07)'; b.beginPath(); b.roundRect(p.x0 + 3, p.y0 + 3, p.w - 6, p.h - 6, 6); b.fill(); b.strokeStyle = 'rgba(60,120,40,.25)'; b.lineWidth = 1.2; b.stroke(); });
  // Straßen (Sandwege wie auf muscheltal.de) mit Bordstein
  const SEG = strassen(S.strassen);
  const weg = (w, col) => { b.strokeStyle = col; b.lineWidth = w; b.lineCap = 'round'; SEG.forEach(s => { b.beginPath(); if (s.senkrecht) { b.moveTo(s.fest, s.von); b.lineTo(s.fest, s.bis); } else { b.moveTo(s.von, s.fest); b.lineTo(s.bis, s.fest); } b.stroke(); }); };
  weg(STR + 5, '#d9b46a'); weg(STR, '#f0dca0');
  b.fillStyle = 'rgba(160,120,60,.18)'; SEG.forEach(s => { for (let v = s.von; v < s.bis; v += 9) { const o = (Math.random() - .5) * STR * .7; s.senkrecht ? b.fillRect(s.fest + o, v, 1.6, 1.6) : b.fillRect(v, s.fest + o, 1.6, 1.6); } });
  // Straßennamen auf dem Weg + Straßenschild am Anfang
  b.textAlign = 'center'; b.textBaseline = 'middle';
  SEG.forEach(s => {
    const len = s.bis - s.von, n = len > 520 ? 2 : 1;
    for (let k = 0; k < n; k++) {
      const v = s.von + len * (k + 1) / (n + 1);
      b.save(); s.senkrecht ? (b.translate(s.fest, v), b.rotate(-Math.PI / 2)) : b.translate(v, s.fest);
      b.font = `900 15px ${FONT}`; const tw = b.measureText(s.name).width + 22;
      b.fillStyle = '#2f6fb3'; b.beginPath(); b.roundRect(-tw / 2, -11, tw, 22, 5); b.fill();         // blaues Straßenschild
      b.strokeStyle = '#fff'; b.lineWidth = 1.6; b.beginPath(); b.roundRect(-tw / 2 + 2.5, -8.5, tw - 5, 17, 3.5); b.stroke();
      b.fillStyle = '#fff'; b.fillText(s.name, 0, .5);
      b.restore();
    }
  });
  b.restore();
  // Palmen und Strandkörbe am Ufer
  for (let i = 0; i < 26; i++) { const a = i / 26 * 6.283 + .1, k = rand(a) * .995; palme(b, IX + Math.cos(a) * RX * k, IY + Math.sin(a) * RY * k, .75, i * 300); }
  for (let i = 0; i < 9; i++) { const a = i / 9 * 6.283 + .45, k = rand(a) * 1.015; schirm(b, IX + Math.cos(a) * RX * k, IY + Math.sin(a) * RY * k, ['#e8433c', '#3fa0e8', '#ffb02e', '#ff6fa3'][i % 4]); }
  BASIS = cv; BASIS_NAMEN = S.strassen.join();
}
function schirm(c, x, y, col) {
  c.fillStyle = '#fff'; c.beginPath(); c.roundRect(x - 12, y + 2, 24, 9, 3); c.fill();
  c.fillStyle = 'rgba(0,0,0,.12)'; c.beginPath(); c.ellipse(x + 6, y + 8, 16, 6, 0, 0, 7); c.fill();
  c.strokeStyle = '#6b4423'; c.lineWidth = 2; c.beginPath(); c.moveTo(x, y + 6); c.lineTo(x, y - 14); c.stroke();
  for (let i = 0; i < 6; i++) { c.fillStyle = i % 2 ? '#fff' : col; c.beginPath(); c.moveTo(x, y - 18); c.arc(x, y - 18, 16, Math.PI + i * Math.PI / 6, Math.PI + (i + 1) * Math.PI / 6); c.fill(); }
}
function palme(c, x, y, s, t) {
  c.save(); c.translate(x, y); c.scale(s, s);
  c.fillStyle = 'rgba(0,0,0,.15)'; c.beginPath(); c.ellipse(10, 4, 26, 9, 0, 0, 7); c.fill();
  c.strokeStyle = '#8a5a2b'; c.lineWidth = 9; c.lineCap = 'round';
  c.beginPath(); c.moveTo(0, 0); c.quadraticCurveTo(-8, -30, 4, -58); c.stroke();
  c.strokeStyle = '#6b4423'; c.lineWidth = 1.5; for (let i = 1; i < 6; i++) { c.beginPath(); c.moveTo(-5 + i * .3, -i * 10); c.lineTo(4 - i * .2, -i * 10 - 2); c.stroke(); }
  const w = Math.sin(t * .002) * .08;
  for (let i = 0; i < 7; i++) { c.save(); c.translate(4, -58); c.rotate(i * .9 + w); c.fillStyle = i % 2 ? '#3f9b45' : '#57b85a'; c.beginPath(); c.ellipse(21, 0, 25, 7.5, 0, 0, 7); c.fill(); c.restore(); }
  c.fillStyle = '#6b3f1d'; c.beginPath(); c.arc(1, -55, 4.5, 0, 7); c.arc(8, -54, 4.5, 0, 7); c.arc(4, -50, 4.5, 0, 7); c.fill();
  c.restore();
}

// ================= Live-Daten =================
function verbinde() {
  const es = new EventSource('/events');
  es.onmessage = m => ereignis(JSON.parse(m.data));
  es.onerror = () => { es.close(); setTimeout(verbinde, 2000); };
}
const sp = id => S.spieler.find(p => p.id === id);
const platzVon = p => PLAETZE[p.platz];
function ereignis(e) {
  const p = e.id && sp(e.id), pl = p && platzVon(p);
  switch (e.typ) {
    case 'zustand': S = e.s; if (!BASIS || BASIS_NAMEN !== S.strassen.join()) basisZeichnen(); break;
    case 'neu': setTimeout(() => { const q = sp(e.id); if (q && platzVon(q)) { pop[e.id] = performance.now(); funken(platzVon(q), '✨', 8); } }, 300); break;
    case 'stufe': if (pl) { pop[e.id] = performance.now(); funken(pl, '⭐', 18); fokus(pl, 4200); } break;
    case 'anbau': case 'farbe': if (pl) { pop[e.id] = performance.now(); funken(pl, '🔨', 5); fokus(pl, 2600, true); } break;
    case 'geschenk':
      banner.push({ t: 0, oben: `🎁 ${p ? p.name : ''}`, unten: (e.anzahl > 1 ? e.anzahl + '× ' : '') + e.name, farbe: PINK });
      if (pl) { funken(pl, '💖', 12 + Math.min(30, e.diamanten)); fokus(pl, 4000); }
      if (e.diamanten >= 100) feuerwerk();
      break;
    case 'follow': banner.push({ t: 0, oben: `🏠 ${p ? p.name : ''}`, unten: 'ist jetzt Bewohner – danke fürs Folgen!', farbe: TUERKIS }); break;
    case 'ziel': banner.push({ t: 0, oben: '🎉 Bewohner-Ziel erreicht!', unten: e.name + ' wird gebaut', farbe: '#9b5de5' }); feuerwerk(); break;
    case 'projekt': case 'fertig': funken({ x: IX, y: IY }, e.typ === 'fertig' ? '🎉' : '🚧', 30); if (e.typ === 'fertig') feuerwerk(); break;
    case 'ansage': untertitel = { text: e.text, t: performance.now() }; break;
  }
}
function funken(pl, z, n) { for (let i = 0; i < n; i++) fx.push({ x: pl.x, y: pl.y - 30, vx: (Math.random() - .5) * 5, vy: -2 - Math.random() * 5, t: performance.now(), z, s: 18 + Math.random() * 14 }); }
function feuerwerk() {
  for (let k = 0; k < 6; k++) setTimeout(() => {
    const x = IX - 380 + Math.random() * 760, y = 700 + Math.random() * 600, col = ['#ffd23f', '#ff6fa3', '#7fe0c8', '#fff', '#ff8a2a', '#b58ad0'][k];
    for (let i = 0; i < 44; i++) { const a = i / 44 * 6.283, v = 3 + Math.random() * 3; fx.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, t: performance.now(), punkt: col, s: 5 }); }
  }, k * 240);
}

// ================= Kamera =================
const cam = { x: IX, y: IY, z: 1 }, ZIEL = { x: IX, y: IY, z: 1 };
let fokusBis = 0, fokusLetzt = 0;
const MITTE_Y = 1205;                                     // Bildschirm-Punkt, auf den die Kamera zielt
function fokus(pl, ms, leise) {
  const t = performance.now();
  if (leise && t < fokusBis) return;                      // kleine Ereignisse unterbrechen keinen laufenden Zoom
  if (t - fokusLetzt < 1800 && t < fokusBis) return;
  fokusLetzt = t; fokusBis = t + ms;
  Object.assign(ZIEL, { x: pl.x, y: pl.y - 30, z: 2.6 });
}
function kamera(t) {
  if (t > fokusBis) Object.assign(ZIEL, { x: IX, y: IY, z: 1 });
  const k = .055; cam.x += (ZIEL.x - cam.x) * k; cam.y += (ZIEL.y - cam.y) * k; cam.z += (ZIEL.z - cam.z) * k;
  X.setTransform(cam.z, 0, 0, cam.z, 540 - cam.x * cam.z, MITTE_Y - cam.y * cam.z);
}

// ================= Zeichen-Hilfen =================
function rr(x, y, w, h, r) { X.beginPath(); X.roundRect(x, y, w, h, r); }
function text(t, x, y, size, col = INK, align = 'left', weight = 900, maxW) {
  X.font = `${weight} ${size}px ${FONT}`; X.fillStyle = col; X.textAlign = align; X.textBaseline = 'middle';
  if (maxW) { let s = size; while (X.measureText(t).width > maxW && s > 10) { s -= 1; X.font = `${weight} ${s}px ${FONT}`; } }
  X.fillText(t, x, y);
}
function karte(x, y, w, h, fill, r = 999) {                // Homepage-Stil: Rahmen + harter Schatten
  X.fillStyle = INK; rr(x + 10, y + 10, w, h, r); X.fill();
  X.fillStyle = fill; rr(x, y, w, h, r); X.fill();
  X.lineWidth = 7; X.strokeStyle = INK; X.stroke();
}
const mix = (hex, f) => { const n = parseInt(hex.slice(1), 16); const k = v => Math.max(0, Math.min(255, f < 1 ? v * f : v + (255 - v) * (f - 1))) | 0; return `rgb(${k(n >> 16 & 255)},${k(n >> 8 & 255)},${k(n & 255)})`; };

// ================= Meer =================
function meer(t) {
  const g = X.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#3ec3b4'); g.addColorStop(1, '#1d8a82');
  X.setTransform(1, 0, 0, 1, 0, 0); X.fillStyle = g; X.fillRect(0, 0, W, H);
}
function wellen(t) {
  X.strokeStyle = 'rgba(255,255,255,.22)'; X.lineWidth = 3; X.lineCap = 'round';
  for (let i = 0; i < 70; i++) {
    const x = (i * 197 + t * .01 * (1 + i % 3)) % 1400 - 160, y = 300 + (i * 331) % 1800;
    if (innen(x, y, 1.12)) continue;
    X.beginPath(); X.moveTo(x, y); X.quadraticCurveTo(x + 12, y - 7, x + 24, y); X.stroke();
  }
}

// ================= Muschelplatz mit Luxus-Muschel =================
function platz(t) {
  const c = X;
  // Marmorplatz mit Sternmuster
  c.fillStyle = 'rgba(0,0,0,.12)'; c.beginPath(); c.arc(IX + 5, IY + 7, PLATZ_R, 0, 7); c.fill();
  for (let i = 0; i < 24; i++) { c.fillStyle = i % 2 ? '#f6efe2' : '#ebe0cc'; c.beginPath(); c.moveTo(IX, IY); c.arc(IX, IY, PLATZ_R, i / 24 * 6.283, (i + 1) / 24 * 6.283); c.fill(); }
  c.strokeStyle = '#c99a2e'; c.lineWidth = 5; c.beginPath(); c.arc(IX, IY, PLATZ_R - 2, 0, 7); c.stroke();
  c.strokeStyle = '#e8c766'; c.lineWidth = 2; c.beginPath(); c.arc(IX, IY, PLATZ_R - 10, 0, 7); c.stroke();
  // Hecken + goldene Laternen rundherum
  for (let i = 0; i < 8; i++) {
    const a = i / 8 * 6.283 + Math.PI / 8, x = IX + Math.cos(a) * (PLATZ_R - 26), y = IY + Math.sin(a) * (PLATZ_R - 26);
    c.fillStyle = '#3f9b45'; c.beginPath(); c.arc(x, y, 12, 0, 7); c.fill(); c.fillStyle = '#57b85a'; c.beginPath(); c.arc(x - 3, y - 3, 7, 0, 7); c.fill();
    c.fillStyle = ['#ff6fa3', '#fff', '#ffd23f'][i % 3]; for (let k = 0; k < 4; k++) { c.beginPath(); c.arc(x + Math.cos(k * 1.6) * 7, y + Math.sin(k * 1.6) * 7, 2.2, 0, 7); c.fill(); }
    const a2 = i / 8 * 6.283, lx = IX + Math.cos(a2) * (PLATZ_R - 22), ly = IY + Math.sin(a2) * (PLATZ_R - 22);
    c.fillStyle = '#b8862a'; c.fillRect(lx - 1.5, ly - 24, 3, 24); c.fillStyle = '#ffe9a8'; c.shadowColor = '#ffd23f'; c.shadowBlur = 12; c.beginPath(); c.arc(lx, ly - 26, 5, 0, 7); c.fill(); c.shadowBlur = 0;
  }
  // Brunnenbecken
  const g = c.createRadialGradient(IX, IY, 20, IX, IY, 104); g.addColorStop(0, '#9ff0e4'); g.addColorStop(1, '#2fb3a0');
  c.fillStyle = '#d8c7a6'; c.beginPath(); c.ellipse(IX, IY + 8, 112, 96, 0, 0, 7); c.fill();
  c.fillStyle = g; c.beginPath(); c.ellipse(IX, IY + 6, 102, 86, 0, 0, 7); c.fill();
  const rg = c.createLinearGradient(IX - 110, 0, IX + 110, 0); rg.addColorStop(0, '#b8862a'); rg.addColorStop(.5, '#ffe9a8'); rg.addColorStop(1, '#b8862a');
  c.strokeStyle = rg; c.lineWidth = 6; c.beginPath(); c.ellipse(IX, IY + 6, 104, 88, 0, 0, 7); c.stroke();
  c.strokeStyle = 'rgba(255,255,255,.55)'; c.lineWidth = 1.5;
  for (let i = 0; i < 3; i++) { const r = ((t * .02 + i * 30) % 90); c.globalAlpha = 1 - r / 90; c.beginPath(); c.ellipse(IX, IY + 20, 30 + r * .7, 18 + r * .5, 0, 0, 7); c.stroke(); }
  c.globalAlpha = 1;
  // Wasserfontänen
  for (let i = 0; i < 6; i++) {
    const a = i / 6 * 6.283 + .3, x = IX + Math.cos(a) * 82, y = IY + 6 + Math.sin(a) * 68, h = 26 + Math.sin(t * .006 + i) * 4;
    c.strokeStyle = 'rgba(220,250,255,.85)'; c.lineWidth = 2.5; c.beginPath(); c.moveTo(x, y); c.quadraticCurveTo(x + (IX - x) * .25, y - h * 1.6, x + (IX - x) * .45, y - h * .2); c.stroke();
  }
  // Sockel: runder Marmorsockel in zwei Stufen mit Goldbändern
  const sg = c.createLinearGradient(IX - 60, 0, IX + 60, 0); sg.addColorStop(0, '#d9ccb4'); sg.addColorStop(.45, '#fbf6ec'); sg.addColorStop(1, '#cbbda2');
  const gb = c.createLinearGradient(IX - 60, 0, IX + 60, 0); gb.addColorStop(0, '#a87420'); gb.addColorStop(.5, '#ffe9a8'); gb.addColorStop(1, '#a87420');
  [[58, 20, 34], [42, 14, 18]].forEach(([rx, ry, y]) => {
    c.fillStyle = sg; c.beginPath(); c.ellipse(IX, IY + y + 10, rx, ry, 0, 0, Math.PI); c.lineTo(IX - rx, IY + y); c.ellipse(IX, IY + y, rx, ry, 0, Math.PI, 0, true); c.closePath(); c.fill();
    c.fillStyle = gb; c.fillRect(IX - rx, IY + y + 3, rx * 2, 3);
    c.fillStyle = '#fbf6ec'; c.beginPath(); c.ellipse(IX, IY + y, rx, ry, 0, 0, 7); c.fill(); c.strokeStyle = gb; c.lineWidth = 2.5; c.stroke();
  });
  // Die Muschel (Jakobsmuschel, perlmutt + Gold)
  c.save(); c.translate(IX, IY + 4);
  c.shadowColor = 'rgba(255,215,120,.9)'; c.shadowBlur = 30 + Math.sin(t * .003) * 10;
  const f = 76, rippen = 13;
  const pg = c.createRadialGradient(0, -10, 6, 0, -20, f * 1.25);
  pg.addColorStop(0, '#fffaf2'); pg.addColorStop(.35, '#ffe1ec'); pg.addColorStop(.6, '#ffd9b0'); pg.addColorStop(.8, '#d9f3f2'); pg.addColorStop(1, '#f2c4dc');
  c.beginPath(); c.moveTo(0, 18);
  for (let i = 0; i <= rippen; i++) { const a = Math.PI + .25 + i / rippen * (Math.PI - .5), a2 = a + (Math.PI - .5) / rippen / 2; c.lineTo(Math.cos(a) * f, Math.sin(a) * f * .95 + 8); if (i < rippen) c.quadraticCurveTo(Math.cos(a2) * f * 1.12, Math.sin(a2) * f * 1.06 + 8, Math.cos(a2 + (Math.PI - .5) / rippen / 2) * f, Math.sin(a2 + (Math.PI - .5) / rippen / 2) * f * .95 + 8); }

const HOEHE = [-38, -46, -62, -46, -64, -76, -66, -60, -82, -82];   // Dach-Oberkante je Stufe (für die Flagge)

function haus(p, pl, t) {
  const c = X, f = p.farbe || FARBEN[p.platz % FARBEN.length], st = Math.min(p.stufe, HAUS.length - 1), a = p.anbauten || [];
  const seit = pop[p.id] ? t - pop[p.id] : 9999, hops = seit < 700 ? 1 + Math.sin(seit / 700 * Math.PI) * .3 : 1;
  c.save(); c.translate(pl.x, pl.y);
  // Grundstück-Deko: ab Bungalow eigener Rasen mit Hecke, Weg zur Straße
  if (st >= 3) { c.fillStyle = 'rgba(70,150,50,.35)'; c.beginPath(); c.roundRect(-pl.w / 2 + 4, -pl.h * .78 + 4, pl.w - 8, pl.h - 8, 6); c.fill(); }
  c.fillStyle = '#efd9a0'; c.fillRect(-3, 0, 6, pl.h * .22 + 4);
  if (a.includes('garten')) { c.fillStyle = '#6b4423'; c.beginPath(); c.roundRect(-34, 2, 22, 8, 3); c.fill(); blumen(c, -32, 5, 5, 20); }
  if (a.includes('pool') && st < 6) { c.fillStyle = '#fff'; c.beginPath(); c.roundRect(14, 1, 22, 11, 3); c.fill(); c.fillStyle = '#3fa0e8'; c.beginPath(); c.roundRect(16, 3, 18, 7, 2); c.fill(); }
  c.fillStyle = 'rgba(0,0,0,.18)'; c.beginPath(); c.ellipse(4, 3, 28 + st * 1.5, 7, 0, 0, 7); c.fill();
  c.scale(hops, hops); c.lineJoin = 'round';
  HAUS[st](c, f, t + p.platz * 137);
  if (a.includes('flagge')) { const h = HOEHE[st]; c.strokeStyle = INK; c.lineWidth = 1.5; c.beginPath(); c.moveTo(-2, h); c.lineTo(-2, h - 14); c.stroke(); c.fillStyle = f; c.beginPath(); c.moveTo(-2, h - 14); c.lineTo(9 + Math.sin(t * .006) * 2, h - 11); c.lineTo(-2, h - 8); c.fill(); }
  c.restore();
  if (a.includes('palme')) palme(X, pl.x - 30, pl.y - 2, .42, t);
  if (a.includes('laterne')) { X.fillStyle = INK; X.fillRect(pl.x + 30, pl.y - 22, 2.5, 24); X.fillStyle = '#ffe9a8'; X.shadowColor = '#ffd23f'; X.shadowBlur = 8; X.beginPath(); X.arc(pl.x + 31, pl.y - 24, 4, 0, 7); X.fill(); X.shadowBlur = 0; }
  if (a.includes('boot')) { X.fillStyle = '#8a5a2b'; X.beginPath(); X.roundRect(pl.x + 14, pl.y + 4, 22, 6, 3); X.fill(); X.fillStyle = '#fff'; X.beginPath(); X.moveTo(pl.x + 24, pl.y + 3); X.lineTo(pl.x + 24, pl.y - 10); X.lineTo(pl.x + 32, pl.y + 3); X.fill(); }
  // Name auf dem Grundstück
  const n = p.name; let fs = 11; X.font = `900 ${fs}px ${FONT}`;
  while (X.measureText(n).width > pl.w - 12 && fs > 6.5) { fs -= .5; X.font = `900 ${fs}px ${FONT}`; }
  const w = X.measureText(n).width + 8;
  X.fillStyle = 'rgba(255,255,255,.93)'; rr(pl.x - w / 2, pl.y + 8, w, 15, 7.5); X.fill();
  X.fillStyle = INK; X.textAlign = 'center'; X.textBaseline = 'middle'; X.fillText(n, pl.x, pl.y + 16);
}

// ================= Kopfzeile =================
let seite = 0, seiteSeit = 0;
function kopf(t) {
  X.setTransform(1, 0, 0, 1, 0, 0);
  // Logo wie auf muscheltal.de: gelbe Pille, Muschel-Logo, leicht gedreht
  X.save(); X.translate(36, 150); X.rotate(-2 * Math.PI / 180);
  X.font = `900 52px ${FONT}`; const lw = Math.max(X.measureText('MUSCHEL-TAL').width, 300) + 150;
  karte(0, 0, lw, 112, GELB);
  if (LOGO.complete && LOGO.naturalWidth) X.drawImage(LOGO, 8, 8, 96, 96);
  text('MUSCHEL-TAL', 116, 44, 52, INK, 'left', 900);
  X.globalAlpha = .75; text('by @muscheltal', 118, 86, 27, INK, 'left', 800); X.globalAlpha = 1;
  X.restore();
  // Muschelkasse
  karte(668, 150, 376, 112, '#fff', 999);
  text('🐚 ' + (S.kasse || 0).toLocaleString('de-DE'), 856, 192, 44, INK, 'center', 900, 330);
  text('Muschelkasse · 1 Like = 1 🐚', 856, 236, 21, '#8a5a2b', 'center', 800, 330);
  // Bewohner-Ziel
  const z = S.ziel, bw = S.bewohner || 0;
  karte(36, 288, 1008, 104, '#fff', 34);
  if (z) {
    const f = Math.min(1, bw / z.ziel);
    text(`${z.icon || '🏗️'} ${z.name}`, 66, 320, 30, INK, 'left', 900, 560);
    text(`${bw.toLocaleString('de-DE')} / ${z.ziel.toLocaleString('de-DE')} Bewohner`, 1014, 320, 28, INK, 'right', 900, 400);
    X.fillStyle = 'rgba(42,27,18,.1)'; rr(66, 346, 948, 26, 13); X.fill();
    const g = X.createLinearGradient(66, 0, 1014, 0); g.addColorStop(0, TUERKIS); g.addColorStop(1, '#7fe0c8');
    X.fillStyle = g; rr(66, 346, Math.max(26, 948 * f), 26, 13); X.fill();
    X.strokeStyle = INK; X.lineWidth = 3.5; rr(66, 346, 948, 26, 13); X.stroke();
    text(`Folgen = einziehen 🏠 · noch ${Math.max(0, z.ziel - bw)} bis ${z.ort ? 'zum Bau auf der ' + z.ort : 'zum Ziel'}`, 540, 360, 18, INK, 'center', 900, 900);
  } else text(`🏠 ${bw.toLocaleString('de-DE')} Bewohner · Folgen = einziehen`, 540, 340, 32, INK, 'center');
  // Untere Info-Zeile: Abstimmung, sonst abwechselnd Regeln / Projekt + Top 3
  const a = S.abstimmung;
  if (a) {
    karte(36, 416, 1008, 196, '#fff', 34);
    text(`🗳️ Was bauen wir? Schreib 1, 2 oder 3 · ${a.rest}s`, 540, 448, 29, INK, 'center', 900, 950);
    const sum = a.stimmen.reduce((x, y) => x + y, 0) || 1;
    a.optionen.forEach((o, i) => {
      const y = 474 + i * 42, f = a.stimmen[i] / sum;
      X.fillStyle = 'rgba(42,27,18,.08)'; rr(66, y, 948, 34, 17); X.fill();
      X.fillStyle = [GELB, '#7fe0c8', '#ff8fb8'][i]; rr(66, y, Math.max(34, 948 * f), 34, 17); X.fill();
      text(`${i + 1}  ${o}`, 86, y + 18, 23, INK, 'left', 900); text(String(a.stimmen[i]), 994, y + 18, 23, INK, 'right', 900);
    });
    return;
  }
  if (t - seiteSeit > 8000) { seite = (seite + 1) % (S.projekt ? 2 : 1); seiteSeit = t; }
  karte(36, 416, 626, 120, '#fff3c4', 30);
  if (seite === 1 && S.projekt) {
    const pr = S.projekt;
    text(`🏗️ Wir bauen: ${pr.name}`, 62, 448, 27, INK, 'left', 900, 580);
    X.fillStyle = 'rgba(42,27,18,.1)'; rr(62, 470, 574, 22, 11); X.fill();
    X.fillStyle = GELB; rr(62, 470, Math.max(22, 574 * pr.stand / pr.ziel), 22, 11); X.fill();
    X.strokeStyle = INK; X.lineWidth = 3; rr(62, 470, 574, 22, 11); X.stroke();
    text(`${Math.floor(pr.stand).toLocaleString('de-DE')} / ${pr.ziel.toLocaleString('de-DE')} 🐚 aus der Muschelkasse`, 62, 512, 19, '#8a5a2b', 'left', 800, 574);
  } else {
    [['❤️', 'Liken = Haus wächst'], ['💬', 'pool · garten · boot · palme · rot · blau …'], ['🎁', 'Geschenk = großer Ausbau']].forEach(([i, s], k) => {
      text(i, 60, 446 + k * 32, 23, INK, 'left', 400); text(s, 100, 446 + k * 32, 22, INK, 'left', 800, 540);
    });
  }
  karte(686, 416, 358, 120, '#fff', 30);
  const top = [...S.spieler].sort((x, y) => y.muscheln - x.muscheln).slice(0, 3);
  text('🏆 Top-Häuser', 865, 438, 21, INK, 'center', 900);
  top.forEach((p, k) => { const y = 466 + k * 26; text(`${k + 1}. ${p.name}`, 706, y, 19, INK, 'left', 800, 190); text(S.stufen[p.stufe] || '', 1026, y, 17, '#8a5a2b', 'right', 900, 120); });
}

function effekte(t) {
  for (let i = fx.length - 1; i >= 0; i--) {
    const f = fx[i], age = (t - f.t) / 1000;
    if (age > 1.6) { fx.splice(i, 1); continue; }
    const x = f.x + f.vx * age * 60, y = f.y + f.vy * age * 60 + 120 * age * age;
    X.globalAlpha = 1 - age / 1.6;
    if (f.punkt) { X.fillStyle = f.punkt; X.beginPath(); X.arc(x, y, f.s, 0, 7); X.fill(); }
    else { X.font = `${f.s}px ${FONT}`; X.textAlign = 'center'; X.textBaseline = 'middle'; X.fillText(f.z, x, y); }
  }
  X.globalAlpha = 1;
}
function overlay(t) {
  X.setTransform(1, 0, 0, 1, 0, 0);
  if (banner.length && !banner[0].t) banner[0].t = t;
  while (banner.length && t - banner[0].t > 3200) { banner.shift(); if (banner[0]) banner[0].t = t; }
  const b = banner[0];
  if (b) {
    const age = (t - b.t) / 1000, k = Math.max(0, Math.min(1, age * 4, (3.2 - age) * 4));
    X.save(); X.globalAlpha = k; X.translate(540, 760); X.scale(.85 + .15 * k, .85 + .15 * k);
    karte(-440, -66, 880, 132, b.farbe, 40);
    text(b.oben, 0, -22, 42, '#fff', 'center', 900, 820); text(b.unten, 0, 28, 30, '#fff', 'center', 800, 820);
    X.restore();
  }
  const ua = (t - untertitel.t) / 1000;
  if (untertitel.text && ua < 5) {
    X.globalAlpha = Math.min(1, (5 - ua) * 2);
    X.font = `800 27px ${FONT}`; const w = Math.min(1008, X.measureText(untertitel.text).width + 50);
    X.fillStyle = 'rgba(42,27,18,.85)'; rr(540 - w / 2, S.abstimmung ? 636 : 562, w, 52, 26); X.fill();
    text(untertitel.text, 540, (S.abstimmung ? 636 : 562) + 26, 27, '#fff', 'center', 800, 960);
    X.globalAlpha = 1;
  }
  if (S.test) text('TEST-MODUS', 1040, 128, 20, 'rgba(255,255,255,.8)', 'right', 900);
}

function bild(t) {
  meer(t); kamera(t); wellen(t);
  if (BASIS) X.drawImage(BASIS, OX, OY, OW, OH);
  platz(t);
  S.spieler.filter(p => platzVon(p)).sort((a, b) => platzVon(a).y - platzVon(b).y).forEach(p => haus(p, platzVon(p), t));
  effekte(t);
  if (S.spieler.length > PLAETZE.length) { X.setTransform(1, 0, 0, 1, 0, 0); text(`+ ${S.spieler.length - PLAETZE.length} warten auf ein Grundstück`, 540, 1880, 22, '#fff', 'center', 900); }
  kopf(t); overlay(t);
  requestAnimationFrame(bild);
}
verbinde();
requestAnimationFrame(bild);
</script>

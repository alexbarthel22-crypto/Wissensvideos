# Netlify baut die Muschel-Tal-Seite neu aus muscheltal/daten/ – aber nur, wenn sich im Ordner muscheltal/ etwas geändert hat.
# (Video-Commits lösen so keinen Build aus und verbrauchen keine Netlify-Kontingente.)
[build]
  command = "python3 muscheltal/bau.py"
  publish = "muscheltal/site"
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- muscheltal/ netlify.toml package.json"

[build.environment]
  PYTHON_VERSION = "3.12"

# Inselkasse (Story teilen = +50 Muscheln), speichert in Netlify Blobs
[functions]
  directory = "muscheltal/netlify/functions"
